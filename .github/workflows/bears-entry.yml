name: Refresh Bears first-team entry
on:
  schedule:
    - cron: '15 0,4,7,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bears-entry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_bears_entry.py
      - name: Save updated entry
        run: |
          git add data/bears-entry.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Bears first-team entry'
          git push
