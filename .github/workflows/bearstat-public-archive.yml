name: BEARStat public archive
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Archive past-season KBO situational records']
    types: [completed]
  schedule:
    - cron: '17 15 * * *'
  push:
    branches: [main]
    paths: ['index.html', 'assets/result-bears/**', 'scripts/export-notification-events.py', 'scripts/export-public-records.py', '.github/workflows/bearstat-public-archive.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bearstat-public-archive
  cancel-in-progress: false
# build and deploy are separate jobs on purpose. deploy-pages finds the "github-pages"
# artifact by listing the run's artifacts, and right after an upload inside the same job
# that listing can still come back empty ("Found 0 artifact(s)"), which failed every run
# from 2026-11-24 on (actions/deploy-pages#451). A separate job leaves the artifact time
# to become listable, and the wait plus the single retry below cover the slow tail.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      export_outcome: ${{ steps.export.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public rows and preserve the last good archive on failure
        id: export
        continue-on-error: true
        run: python scripts/export-public-records.py
      - name: Commit changed public snapshot
        if: steps.export.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update BEARStat public record archive'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require an existing valid snapshot before deployment
        run: python -c "import json; m=json.load(open('data/manifest.json')); assert m['schemaVersion']==1"
      - uses: actions/configure-pages@v5
      - name: Export built-in national and handball notification schedules
        run: python scripts/export-notification-events.py
      - name: Prepare public site only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          cp -r assets _site/
          for file in sw.js sw-cloudflare.js manifest.webmanifest favicon.png apple-touch-icon.png; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Let the artifact listing catch up with the build job
        run: sleep 20
      - name: Deploy saved public records even when Supabase is restricted
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the artifact listing before a second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy again once the artifact listing catches up
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Report refresh failure without deleting the last good archive
        if: needs.build.outputs.export_outcome != 'success'
        run: |
          echo '::warning::Supabase refresh failed; the last saved public archive was deployed.'
