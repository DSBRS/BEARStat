 * Event = {id,date,type,title,time,opp,venue,starter,score:{d,o},stage,gameNo,series,

const pad=n=>String(n).padStart(2,'0');

let isOwner=false,CUSTOM=[],SB=null,BEARS_ROSTER=[],ROSTERS_BY_YEAR={},EDU_ROSTERS_BY_YEAR={},OTHERS_BY_YEAR={},AUTO_STANDINGS_BY_YEAR={},HIDDEN_AUTO_IDS=[];

  async saveRoster(rows,year=adminRosterYear){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');rows=normRoster(rows);const y=+year||TODAY.getFullYear(),key='bears_roster_'+y;const r=await SB.from('kv').upsert({key,body:rows});if(r.error)throw r.error;ROSTERS_BY_YEAR[y]=rows;if(y===TODAY.getFullYear())BEARS_ROSTER=rows;rerender()},

function futuresEvent(row){

  }
  if(S(meta.seriesId??g.SR_ID)!=='0')return null;

  const id=S(meta.gameId||g.G_ID||b.id),date=S(g.G_DT||row.date||b.date).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!id)return null;
  const isHome=home==='OB',cancel=S(g.CANCEL_SC_ID??b.status?.cancel)!=='0',final=!cancel&&S(g.GAME_STATE_SC??b.status?.state)==='3'&&Number(g.GAME_RESULT_CK??b.status?.result)===1;
  const d=isHome?(g.B_SCORE_CN??b.score?.home):(g.T_SCORE_CN??b.score?.away),v=isHome?(g.T_SCORE_CN??b.score?.away):(g.B_SCORE_CN??b.score?.home);
  const opp=S(isHome?(g.AWAY_NM||b.teams?.away?.name):(g.HOME_NM||b.teams?.home?.name));
  return {id:'futures-'+id,type:'futures',source:'futures',kboGameId:id,date,title:'두산 vs '+opp,opp,
    homeAway:isHome?'home':'away',time:S(g.G_TM),venue:S(g.S_NM),place:S(g.S_NM),stage:'',headerNo:Number(g.HEADER_NO)||0,
    status:cancel?'cancelled':final?'final':'scheduled',cancelReason:cancel?S(g.CANCEL_SC_NM):'',
    score:final&&S(d)!==''&&S(v)!==''?{d:Number(d),v:Number(v)}:null,
    kbo:{...meta,leagueId:2,seriesId:0},batting:[],pitching:[]};
}

function mergeEvents(manual,automatic){
  const rows=manual.map(e=>({...e})),warnings=[];
  const same=(m,a)=>m.type===a.type&&m.date===a.date&&m.opp===a.opp&&(!m.homeAway||m.homeAway===a.homeAway);
  for(const auto of automatic){
    let matches=rows.filter(m=>m.type===auto.type&&(m.kboGameId===auto.kboGameId||m.id===auto.id));
    if(!matches.length){matches=rows.filter(m=>!m.kboGameId&&same(m,auto));if(matches.length&&(matches.length!==1||automatic.filter(a=>same(matches[0],a)).length!==1||auto.headerNo>0)){warnings.push(`${auto.date} ${auto.opp}: 더블헤더 또는 중복 수동 일정 — 경기 ID 연결 필요`);continue}}
    if(matches.length>1){warnings.push(`${auto.kboGameId}: 중복 연결`);continue}
    if(!matches.length){rows.push({...auto});continue}
    const old=matches[0],index=rows.indexOf(old),merged=old.manualOverride?{...auto,...old}:{...old,...auto};
    if(old.manualOverride&&Array.isArray(old.pitching)&&Array.isArray(auto.pitching))merged.pitching=old.pitching.map(p=>{const base=auto.pitching.find(x=>S(x.name)===S(p.name)&&(!S(p.teamId)||S(x.teamId)===S(p.teamId)));return base?{...base,...p}:p});
    for(const key of ['title','desc','channel','program','players','series'])if(old[key]!==undefined&&old[key]!=='')merged[key]=old[key];
    // 경기 취소 설정은 선수 기록의 수동 우선 여부와 별도로 보존합니다.
    if(old.cancellationOverride||(old.cancellationOverride===undefined&&S(old.cancelReason))){
      merged.cancelReason=S(old.cancelReason);merged.cancelled=isCancelled(old);
      merged.status=merged.cancelled?'cancelled':(auto.status==='cancelled'?(hasScore(merged)?'final':'scheduled'):auto.status);
    }
    merged.id=old.id;merged.kboGameId=auto.kboGameId;merged.kbo=auto.kbo;merged.manualOverride=!!old.manualOverride;rows[index]=merged;
  }
  return{rows,warnings};
}

  let start=idx,end=idx;
  const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00')-Date.parse(a+'T00:00:00'))/86400000);

  while(start>0 && dayDiff(S(games[start-1].date),S(games[start].date))<=3) start--;
  while(end<games.length-1 && dayDiff(S(games[end].date),S(games[end+1].date))<=3) end++;

  const series=games.slice(start,end+1);
  let ab=0,hit=0,played=0;
  series.forEach(e=>{
    const p=e.batting.find(x=>S(x.name)===S(name));
    if(!p)return;
    ab+=+p.atBats||0;
    hit+=+p.hits||0;
    played++;
  });

  if(!played)return null;
  return {ab,hit,games:series.length,played,from:S(series[0].date),to:S(series[series.length-1].date)};
}

function standingsDisplayData(year){
  const remote=Array.isArray(AUTO_STANDINGS_BY_YEAR[year])?AUTO_STANDINGS_BY_YEAR[year]:[];
  const baseline=STANDINGS_BASELINE_BY_YEAR[year];
  if(!baseline)return {rows:remote,baseline:false};
  const normalized=remote.map(r=>({
    ...r,n:S(r?.n||r?.team),rank:Number(r?.rank),
    g:Number(r?.g),w:Number(r?.w),d:Number(r?.d),l:Number(r?.l),p:Number(r?.p)
  }));
  const valid=normalized.length===10 &&
    new Set(normalized.map(r=>r.n)).size===10 &&
    new Set(normalized.map(r=>r.rank)).size===10 &&
    normalized.every(r=>{
      const b=baseline.find(x=>x.n===r.n);
      return b && Number.isInteger(r.rank) && r.rank>=1 && r.rank<=10 &&
        ['g','w','d','l'].every(k=>Number.isInteger(r[k]) && r[k]>=0) &&
        r.g===r.w+r.d+r.l && r.g<=144 &&
        r.w>=b.w && r.d>=b.d && r.l>=b.l &&
        Number.isFinite(r.p) && r.p>=0 && r.p<=1 &&
        Math.abs(r.p-(r.w+r.l?r.w/(r.w+r.l):0))<=0.000501;
    });
  const newer=valid && normalized.some(r=>r.g>baseline.find(b=>b.n===r.n).g);
  const matching=valid && normalized.every(r=>{
    const b=baseline.find(x=>x.n===r.n);
    return r.rank===b.rank && Number(r.p.toFixed(3))===b.p;
  });
  return valid && (newer||matching)
    ? {rows:remote,baseline:false}
    : {rows:baseline,baseline:true};
}

function statHistory(name,stat){
  const yr=String(recYear),
        key={hit:'hits',d2:'doubles',d3:'triples',hr:'homeRuns',sb:'stolenBases',bb:'walks',hbp:'hitByPitch',ibb:'intentionalWalks',rbi:'rbi',runs:'runs'}[stat];

    return list.filter(x=>x===name).length;
  };

  Repo.all()
    .filter(e=>e.type===recLeague&&!isCancelled(e)&&recordSeasonMatches(e)&&S(e.date).slice(0,4)===yr&&hasScore(e))
    .forEach(e=>{
      const p=Array.isArray(e.batting)?e.batting.find(x=>S(x.name)===S(name)):null;

        const hrs=parseHrEntries(e).filter(x=>S(x.player)===S(name));

            date:e.date,
            opp:S(e.opp),

          return;
        }
      }

      let count=p?(stat==='bb'?((+p.walks||0)+(+p.intentionalWalks||0)):(+p[key]||0)):0;

      // Manual games may not have batting[] at all.
      if(!p){
        if(stat==='hit') count=manualCount(e,'hits');
        else if(stat==='d2') count=manualCount(e,'doubles');
        else if(stat==='d3') count=manualCount(e,'triples');
        else if(stat==='sb') count=manualCount(e,'steals');
        else if(stat==='hr'){
          const hitters=rosterForYear(recYear).filter(x=>x.t==='hitter').map(x=>x.n).sort((a,b)=>b.length-a.length);
          count=S(e.homeRuns).split(/\n+/).map(x=>x.trim()).filter(Boolean).filter(line=>{
            const n=hitters.find(h=>line===h||line.startsWith(h+' '));
            return n===name;
          }).length;
        }
      }

      if(count>0){
        out.push({
          date:e.date,
          opp:S(e.opp),
          count,
          detail:''
        });
      }
    });

  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

  const state=recSituation[recKind],roster=recordRoster(),allowed=new Set(roster.filter(x=>x.t===recKind).map(x=>x.n)),out=new Map();
  const matches=x=>x&&x.role===recKind&&x.dimension===state.dimension&&normalizeSituation(state.dimension,x.situation)===state.value;
  // Latest complete season snapshot wins for each player/category, avoiding double counting.
  const snapshot=recLeague==='kbo'&&recSeason==='regular'?KBO_SITUATIONAL_BY_YEAR[recYear]:null;
  for(const raw of snapshot?.rows||[]){const n=S(raw.name);if(matches(raw)&&allowed.has(n))out.set(n,normalizedSplit(raw,n))}
  const daily=new Map(),incomplete=new Set();
  for(const e of Repo.all().filter(e=>e.type===recLeague&&!isCancelled(e)&&recordSeasonMatches(e)&&!isExhibition(e)&&hasScore(e)&&S(e.date).slice(0,4)===String(recYear))){

      const n=S(p.name);if(!allowed.has(n)||out.has(n))continue;

        const r=normalizedSplit(raw,n);if(!daily.has(n))daily.set(n,[]);daily.get(n).push(r);

  }
  for(const [n,parts] of daily){
    if(incomplete.has(n))continue;
    const r={n};
    for(const k of Object.keys(SPLIT_ALIASES).filter(k=>k!=='avg'))r[k]=parts.every(x=>x[k]!==null)?parts.reduce((sum,x)=>sum+x[k],0):null;

function pitcherRoleERA(name){

function opponentStatHistory(name,stat,opp){
  const yr=String(TODAY.getFullYear()),key={hit:'hits',rbi:'rbi',sb:'stolenBases',hr:'homeRuns'}[stat];
  if(!key)return [];
  const rows=[];
  Repo.all()
    .filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===yr&&S(e.opp)===S(opp)&&Array.isArray(e.batting))
    .forEach(e=>{
      const players=e.batting.filter(x=>S(x.name)===S(name));
      const count=players.reduce((total,p)=>total+(+p[key]||0),0);
      if(count<=0)return;

      let detail='';
      if(stat==='hr'){
        const hrs=parseHrEntries(e).filter(x=>S(x.player)===S(name));
        if(hrs.length)detail=hrs.map(x=>`${x.inning}회 · ${x.runs}점 홈런`).join(' / ');
      }

      rows.push({
        date:S(e.date),
        opp:S(e.opp)||'상대팀',
        count,
        detail
      });
    });
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

const opponentAverage=(ab,hit)=>ab?(hit/ab>=1?'1.000':(hit/ab).toFixed(3).slice(1)):'—';
function opponentPlayerGames(name,opp=''){
  const year=String(TODAY.getFullYear()),keys={ab:'atBats',hit:'hits',rbi:'rbi',d2:'doubles',d3:'triples',hr:'homeRuns',sb:'stolenBases'};
  return Repo.all().filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===year&&(!opp||S(e.opp)===S(opp))&&Array.isArray(e.batting)).map(e=>{
    const players=e.batting.filter(p=>S(p.name)===S(name));if(!players.length)return null;
    const stats={};for(const [key,field] of Object.entries(keys))stats[key]=players.reduce((sum,p)=>sum+(+p[field]||0),0);
    return {event:e,...stats,avg:opponentAverage(stats.ab,stats.hit)};
  }).filter(Boolean).sort((a,b)=>S(b.event.date).localeCompare(S(a.event.date))||(+b.event.headerNo||0)-(+a.event.headerNo||0)||S(b.event.time).localeCompare(S(a.event.time)));
}
function opponentBattingSplits(name){
  const byTeam=new Map(TEAMS.map(opp=>[opp,{opp,ab:0,hit:0,rbi:0,d2:0,d3:0,hr:0,sb:0,homeAb:0,homeHit:0,awayAb:0,awayHit:0}]));
  for(const game of opponentPlayerGames(name)){
    const row=byTeam.get(S(game.event.opp));if(!row)continue;
    for(const key of ['ab','hit','rbi','d2','d3','hr','sb'])row[key]+=game[key];
    const side=S(game.event.homeAway);
    if(side==='home'||side==='away'){row[side+'Ab']+=game.ab;row[side+'Hit']+=game.hit;}
  }
  return [...byTeam.values()].map(r=>({...r,avg:opponentAverage(r.ab,r.hit),homeAvg:opponentAverage(r.homeAb,r.homeHit),awayAvg:opponentAverage(r.awayAb,r.awayHit)}));
}

let opponentRelayJob=null;
const OPP_RELAY_STATS=new Set(['ab','hit','d2','d3','hr','avg']);
function startOpponentRelay(){
 const selected=oppHistorySheet;
 if(selected?.stat!=='avgdetail'||!OPP_RELAY_STATS.has(selected.detailStat)){opponentRelayJob=null;return;}
 const {name,opp,detailStat:stat}=selected,signature=JSON.stringify([name,opp,stat,TODAY.getFullYear()]);
 if(opponentRelayJob?.signature===signature)return;
 const games=opponentPlayerGames(name,opp).filter(g=>stat==='avg'?g.ab>0:g[stat]>0).filter(g=>/^\d{8}[A-Z]{4}\d$/.test(S(g.event.kboGameId)));
 const job={signature,total:games.length,done:0,failed:0,running:true};opponentRelayJob=job;let next=0;
 primePlayerRelay(games.map(g=>g.event.kboGameId),name,'hitter').catch(()=>{}).then(()=>Promise.all(Array.from({length:2},async()=>{
  while(next<games.length&&opponentRelayJob===job&&oppHistorySheet===selected&&selected.detailStat===stat){
   const game=games[next++];try{const b=await readSituationRelay(game.event.kboGameId,name,'hitter');if(!relayPlayerAvailable(b,game.event.kboGameId,name,'hitter'))throw Error('서버에서 이 선수의 경기 기록을 사용 불가로 표시')}catch(error){job.failed++;job.errors.push({date:e.date,opp:e.opp||'',id:e.kboGameId,reason:error.message||'연결 오류'})}job.done++;
   if(opponentRelayJob===job&&oppHistorySheet===selected)rerender();
  }
 }))).finally(()=>{job.running=false;if(opponentRelayJob===job&&oppHistorySheet===selected)rerender()});
}

let eduDraft=null;
const EDU_BAT_FIELDS=[['atBats','타수'],['hits','안타'],['doubles','2루타'],['triples','3루타'],['homeRuns','홈런'],['stolenBases','도루'],['walks','볼넷'],['hitByPitch','사구'],['intentionalWalks','고의4구'],['order','타순']];
const EDU_PITCH_FIELDS=[['innings','이닝'],['hits','피안타'],['homeRuns','피홈런'],['strikeouts','탈삼진'],['walks','볼넷'],['hitByPitch','사구'],['runs','실점'],['earnedRuns','자책점']];
function eduInnings(p){
  if(p.outs!==undefined&&p.outs!==null&&p.outs!==''&&Number.isFinite(+p.outs))return `${Math.floor(+p.outs/3)}.${+p.outs%3}`;
  const v=S(p.innings??p.inningsPitched??p.ip)||'0';
  const f=v.match(/^(?:(\d+)\s+)?([12])\/3$/);
  return f?`${+f[1]||0}.${+f[2]}`:v;
}
function ensureEduDraft(e){
  const key=e.id||'new';
  if(eduDraft?.key===key)return;
  eduDraft={key,hitter:new Map(),pitcher:new Map(),selected:{hitter:new Set(),pitcher:new Set()}};
  for(const [role,field] of [['hitter','batting'],['pitcher','pitching']]){
    for(const p of e[field]||[]){
      const n=S(p.name);if(!n)continue;
      const x={...p};
      if(role==='pitcher'){
        x.innings=eduInnings(x);
        const aliases={fourBalls:['fourBalls'],hits:['hitsAllowed','h'],homeRuns:['homeRunsAllowed','hr'],strikeouts:['strikeOuts','so','k'],walks:['basesOnBalls','bb'],hitByPitch:['hitBatters','hbp'],runs:['runsAllowed','r'],earnedRuns:['er']};
        for(const [k,ks] of Object.entries(aliases))if(x[k]===undefined)x[k]=ks.map(a=>x[a]).find(v=>v!==undefined)??0;
      }
      eduDraft[role].set(n,x);eduDraft.selected[role].add(n);
    }
  }
}
function captureEduInputs(validate=false){
  if(!eduDraft)return;
  for(const el of document.querySelectorAll('[data-edu-stat]')){
    const role=el.dataset.eduRole,n=el.dataset.eduName,k=el.dataset.eduStat;
    const p=eduDraft[role].get(n)||{name:n};
    if(k==='innings'){
      const v=S(el.value)||'0',m=v.match(/^(\d+)(?:\.([012]))?$/),f=v.match(/^(?:(\d+)\s+)?([12])\/3$/);
      if(validate&&!m&&!f)throw new Error(n+': 이닝은 0, 1.1, 1.2 또는 1 1/3 형식으로 입력해주세요');
      p.innings=v;if(m||f)p.outs=m?+m[1]*3+(+m[2]||0):(+f[1]||0)*3+(+f[2]);
    }else{
      const v=Number(el.value||0);
      if(validate&&(!Number.isInteger(v)||v<0||(k==='order'&&v>9)))throw new Error(n+': 기록은 0 이상의 정수로, 타순은 0~9로 입력해주세요');
      p[k]=validate?v:el.value;
    }
    eduDraft[role].set(n,p);
  }
  if(validate){
    for(const p of eduSelectedRows('hitter'))if((+p.doubles||0)+(+p.triples||0)+(+p.homeRuns||0)>(+p.hits||0))throw new Error(p.name+': 장타 합계가 안타 수보다 많습니다');
    for(const p of eduSelectedRows('pitcher'))if((+p.earnedRuns||0)>(+p.runs||0))throw new Error(p.name+': 자책점이 실점보다 많습니다');
  }
}
function eduSelectedRows(role){
  return [...eduDraft.selected[role]].map(n=>({...eduDraft[role].get(n),name:n}));
}
function eduEditorHTML(e,part='all'){
  ensureEduDraft(e);
  const year=+(S(e.date).slice(0,4)||TODAY.getFullYear()),roster=eduRosterForYear(year);
  return `${part==='records'?'<h2>교육리그 선수 기록 입력</h2>':`<h2>교육리그 출전 선수 선택</h2><div class="note">출전한 선수를 선택하면 해당 선수의 기록 입력칸이 표시됩니다. 모든 기록이 0이어도 출전자로 저장됩니다. 이닝의 .1은 1/3, .2는 2/3이닝입니다.</div>`}${[['hitter','타자',EDU_BAT_FIELDS],['pitcher','투수',EDU_PITCH_FIELDS]].map(([role,label,fields])=>{
    const candidates=[...new Set([...roster.filter(p=>p.t===role).map(p=>p.n),...eduDraft.selected[role]])];
    return `${part==='records'?'':`<h3>${label} 출전자</h3><div style="display:flex;gap:10px;flex-wrap:wrap">${candidates.map(n=>`<label style="margin:4px 0"><input type="checkbox" style="width:auto" data-edu-select="${role}" data-edu-name="${esc(n)}"${eduDraft.selected[role].has(n)?' checked':''}> ${esc(n)}</label>`).join('')||'<div class="note">선수 관리에서 해당 연도의 교육리그 명단을 등록해주세요.</div>'}</div>`}${part==='selection'?'':[...eduDraft.selected[role]].map(n=>{
      const p=eduDraft[role].get(n)||{name:n};
      return `<div class="card" style="margin-top:12px"><b>${esc(n)}</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px">${fields.map(([k,l])=>`<label>${l}<input ${k==='innings'?'type="text" inputmode="decimal"':'type="number" min="0" step="1"'}${k==='order'?' max="9"':''} data-edu-role="${role}" data-edu-name="${esc(n)}" data-edu-stat="${k}" value="${esc(p[k]??0)}"></label>`).join('')}</div></div>`;
    }).join('')}`;
  }).join('')}`;
}
function refreshEduEditor(){

});

function adminPlayerChoices(e){

function route(){
  const r=location.hash.replace('#/','')||'home';
  $('#app').innerHTML=r==='standings'?standings():r==='records'?records():r==='h2h'?h2hView():r==='opponent'?opponentStatsView():r==='admin'?admin():r==='players'?playerManagement():home();
  $('#nav').innerHTML=[['home','홈'],['standings','순위'],['records','개인기록'],['h2h','맞대결'],['opponent','상대전적']].map(([k,l])=>`<a href="#/${k==='home'?'':k}" class="${r===k?'on':''}">${l}</a>`).join('');
  document.body.dataset.r=r;window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-d],[data-m],[data-t],[data-x],[data-sort],[data-osort],[data-player],[data-sheetclose],[data-sheetback],[data-gamebatter],[data-gameclose],[data-gameback],[data-opphist],[data-oppdetail-stat],[data-oppclose],[data-oppback],[data-rkind],[data-rptab],[data-rbtab],[data-sdimension],[data-svalue],[data-rleague],[data-hstat],[data-sstat],[data-pstat],[data-prole],[data-rseason],[data-orderhist],[data-defensepos],[data-ryear],[data-syear],[data-aroster],[data-aeduroster],[data-ad],[data-am],[data-hrdel],[data-edit],[data-del],[data-hide-auto],[data-restore-auto],#admin_search_btn,#admin_search_clear,#admin_all,#admin_new,#admin_back,#addhr,#save,#saveroster,#saveeduroster,#cancel,#login,#logout');if(!t)return;
  if(!isOwner&&(t.dataset.edit||t.dataset.del||['save','saveroster','saveeduroster','admin_new','addhr'].includes(t.id)))return;
  const keep=()=>{const y=scrollY;route2();scrollTo(0,y)};
  if(t.dataset.d){sel=t.dataset.d;const d=new Date(sel+'T00:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);keep()}
  else if(t.dataset.m!==undefined){const m=+t.dataset.m;if(m===0){sel=TS;view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1)}else view=new Date(view.getFullYear(),view.getMonth()+m,1);keep()}
  else if(t.dataset.x){const id=t.dataset.x;openIds.has(id)?openIds.delete(id):openIds.add(id);keep()}
  else if(t.dataset.gamebatter!==undefined){
    gameBatterSheet={
      name:t.dataset.gamebatter,
      ab:+t.dataset.gameab||0,
      hit:+t.dataset.gamehit||0,
      date:t.dataset.gamedate||'',
      opp:t.dataset.gameopp||'',
      league:t.dataset.gameleague||'kbo',homeAway:t.dataset.gameha||''
    };
    keep()
  }
  else if(t.dataset.gameclose!==undefined){gameBatterSheet=null;keep()}
  else if(t.dataset.gameback!==undefined&&ev.target===t){gameBatterSheet=null;keep()}
  else if(t.dataset.oppdetailStat!==undefined){
    if(oppHistorySheet?.stat!=='avgdetail')return;
    const key=t.dataset.oppdetailStat;
    oppHistorySheet.detailStat=oppHistorySheet.detailStat===key?null:key;
    startOpponentRelay();keep();
  }
  else if(t.dataset.opphist!==undefined){
    oppHistorySheet={
      name:t.dataset.oppplayer||'',
      stat:t.dataset.opphist||'',
      opp:t.dataset.oppteam||h2h||''
    };
    keep()
  }
  else if(t.dataset.oppclose!==undefined){oppHistorySheet=null;keep()}
  else if(t.dataset.oppback!==undefined&&ev.target===t){oppHistorySheet=null;keep()}
  else if(t.dataset.player){situationHistoryStat=null;situationRelayJob=null;playerSheet=t.dataset.player;if(t.dataset.abload!==undefined){situationHistoryStat='ab';startSituationRelay()}playerDefensePosition=null;playerHistoryStat=null;playerOrderHistory=null;pitcherHistoryStat=null;pitcherHistoryRole='all';keep()}
  else if(t.dataset.sheetclose!==undefined){playerSheet=null;playerDefensePosition=null;playerHistoryStat=null;playerOrderHistory=null;pitcherHistoryStat=null;pitcherHistoryRole='all';keep()}
  else if(t.dataset.sheetback!==undefined&&ev.target===t){playerSheet=null;playerDefensePosition=null;keep()}
  else if(t.dataset.sort){const k=t.dataset.sort;recSort=(recSort&&recSort.k===k)?{k,dir:recSort.dir==='desc'?'asc':'desc'}:{k,dir:k==='n'?'asc':'desc'};keep()}  else if(t.dataset.rkind){recKind=t.dataset.rkind;recSort=null;playerSheet=null;pitcherHistoryStat=null;pitcherHistoryRole='all';keep()}
  else if(t.dataset.rptab){recPitchTab=t.dataset.rptab;recSort=null;playerSheet=null;pitcherHistoryStat=null;pitcherHistoryRole='all';keep()}
  else if(t.dataset.rbtab){recBatTab=t.dataset.rbtab;recSort=null;playerSheet=null;playerHistoryStat=null;playerOrderHistory=null;keep()}
  else if(t.dataset.sdimension){const d=t.dataset.sdimension;if(SITUATION_OPTIONS[recKind][d]){recSituation[recKind]={dimension:d,value:SITUATION_OPTIONS[recKind][d][0]};recSort=null;playerSheet=null;keep()}}
  else if(t.dataset.svalue){const state=recSituation[recKind];if(SITUATION_OPTIONS[recKind][state.dimension].includes(t.dataset.svalue)){state.value=t.dataset.svalue;recSort=null;keep()}}
  else if(t.dataset.rleague){if(['kbo','futures'].includes(t.dataset.rleague)||(t.dataset.rleague==='edu'&&hasEducationSchedule())){recLeague=t.dataset.rleague;recSort=null;playerSheet=null;playerHistoryStat=null;playerOrderHistory=null;pitcherHistoryStat=null;pitcherHistoryRole='all';playerDefensePosition=null;}keep()}
  else if(t.dataset.sstat){situationHistoryStat=situationHistoryStat===t.dataset.sstat?null:t.dataset.sstat;startSituationRelay();keep()}
  else if(t.dataset.hstat){playerHistoryStat=playerHistoryStat===t.dataset.hstat?null:t.dataset.hstat;keep()}
  else if(t.dataset.rseason){if(['regular','postseason'].includes(t.dataset.rseason)&&(t.dataset.rseason!=='postseason'||hasPostseasonSchedule())){recSeason=t.dataset.rseason;recSort=null;playerSheet=null;pitcherHistoryStat=null;pitcherHistoryRole='all';playerHistoryStat=null;playerOrderHistory=null;playerDefensePosition=null;}keep()}
  else if(t.dataset.prole){if(['all','start','relief'].includes(t.dataset.prole))pitcherHistoryRole=t.dataset.prole;keep()}
  else if(t.dataset.pstat){pitcherHistoryStat=pitcherHistoryStat===t.dataset.pstat?null:t.dataset.pstat;keep()}
  else if(t.dataset.defensepos!==undefined){
    playerDefensePosition=playerDefensePosition===t.dataset.defensepos?null:t.dataset.defensepos;
    keep()
  }
  else if(t.dataset.orderhist!==undefined){
    const n=+t.dataset.orderhist;
    playerOrderHistory=playerOrderHistory===n?null:n;
    keep()
  }
  else if(t.dataset.ryear!==undefined){const y=recYear+(+t.dataset.ryear||0);recYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));recSort=null;playerSheet=null;keep()}
  else if(t.dataset.syear!==undefined){const y=stYear+(+t.dataset.syear||0);stYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}
  else if(t.dataset.aroster!==undefined){const y=adminRosterYear+(+t.dataset.aroster||0);adminRosterYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}
  else if(t.dataset.aeduroster!==undefined){const y=adminEduRosterYear+(+t.dataset.aeduroster||0);adminEduRosterYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}
  else if(t.dataset.ad){
    adminCalDate=t.dataset.ad;
    adminSearch='';
    const d=new Date(adminCalDate+'T00:00:00');
    adminCalView=new Date(d.getFullYear(),d.getMonth(),1);
    keep()
  }
  else if(t.dataset.am!==undefined){
    const m=+t.dataset.am;
    if(m===0){
      adminCalDate=TS;
      adminSearch='';
      adminCalView=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
    }else{
      adminCalView=new Date(adminCalView.getFullYear(),adminCalView.getMonth()+m,1);
    }
    keep()
  }
  else if(t.id==='admin_search_btn'){
    adminSearch=S(document.querySelector('#admin_search')?.value);
    if(adminSearch)adminCalDate='';
    keep()
  }
  else if(t.id==='admin_search_clear'){
    adminSearch='';
    keep()
  }
  else if(t.id==='admin_all'){
    adminSearch='';
    adminCalDate='';
    keep()
  }
  else if(t.id==='admin_new'){adminFormStep=1;eduDraft=null;editing=null;adminView='form';keep()}
  else if(t.id==='admin_back'){editing=null;adminView='manage';keep()}
  else if(t.dataset.osort){
    const k=t.dataset.osort;
    if(oppSort===k)oppSortDir=oppSortDir==='desc'?'asc':'desc';
    else{oppSort=k;oppSortDir='desc'}
    rerender();
  }  else if(t.dataset.t){h2h=t.dataset.t;oppHistorySheet=null;keep()}
  else if(t.id==='addhr'){const box=$('#hr_rows'),y=+(S($('#f_date')?.value).slice(0,4)||TODAY.getFullYear());if(box)box.insertAdjacentHTML('beforeend',hrRowHTML({},y))}
  else if(t.dataset.hrdel!==undefined){const row=t.closest('.hr-row');if(row){const box=$('#hr_rows');row.remove();if(box&&!box.querySelector('.hr-row'))box.insertAdjacentHTML('beforeend',hrRowHTML({}))}}
  else if(t.id==='login'){SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(r=>{if(r.error)alert('로그인 실패: '+r.error.message)})}
  else if(t.id==='logout'){SB.auth.signOut()}
  else if(t.id==='saveroster'){
    const splitList=id=>[...new Set((document.querySelector(id)?.value||'').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean))];
    const rows=[
      ...splitList('#f_pitchers').map(n=>({n,t:'pitcher'})),
      ...splitList('#f_hitters').map(n=>({n,t:'hitter'}))
    ];
    const seen=new Set(),clean=[];
    rows.forEach(x=>{if(!seen.has(x.n)){seen.add(x.n);clean.push(x)}});
    Repo.saveRoster(clean,adminRosterYear).then(()=>{alert(adminRosterYear+'년 두산 선수 명단을 저장했습니다');keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'')))
  }
  else if(t.id==='saveeduroster'){
    const splitList=id=>[...new Set((document.querySelector(id)?.value||'').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean))];
    const rows=[
      ...splitList('#f_edu_pitchers').map(n=>({n,t:'pitcher'})),
      ...splitList('#f_edu_hitters').map(n=>({n,t:'hitter'}))
    ];
    const seen=new Set(),clean=[];
    rows.forEach(x=>{if(!seen.has(x.n)){seen.add(x.n);clean.push(x)}});
    Repo.saveEduRoster(clean,adminEduRosterYear).then(()=>{alert(adminEduRosterYear+'년 교육리그 참가자 명단을 저장했습니다');keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'')))
  }

    };

      opp=customVal('opp'),
      homeAway=customVal('homeAway'),
      cancelChoice=v('cancelReason'),
      cancelled=cancelChoice!=='',
      cancelReason=cancelChoice==='__cancelled__'?'':customVal('cancelReason'),
      g=type==='kbo'||type==='edu';

if(cancelChoice==='__custom__'&&!cancelReason){
  alert('취소 사유를 직접 입력해주세요');
  $('#f_cancelReason_custom')?.focus();
  return;
}

if(g&&!homeAway){
  alert('경기는 홈/원정을 선택해주세요');
  return;
}

if(g&&!opp){
  alert('경기는 상대팀을 선택해주세요');
  return;
}

const title=g?'두산 vs '+opp:(TYPES[type]||'일정');

if(!v('date')){
  alert('날짜는 필수입니다');
  return;
}
    const sd=v('sd'),so=v('so'),gn=v('gno'),id=editing?editing.id:'c'+Date.now();
    const hrEntries=[...document.querySelectorAll('.hr-row')].map(row=>({player:S(row.querySelector('.hr-player')?.value),inning:+(row.querySelector('.hr-inning')?.value||0),runs:+(row.querySelector('.hr-runs')?.value||0)})).filter(x=>x.player&&x.inning&&x.runs);
    const homeRuns=hrEntries.map(x=>`${x.player} ${x.inning}회 ${x.runs}점`).join('\n');
    const old=editing||{},f=k=>$('#f_'+k)?v(k):S(old[k]);
    const cancellationOverride=!!old.cancellationOverride||cancelled!==isCancelled(old)||cancelReason!==S(old.cancelReason);
    const status=cancelled?'cancelled':(old.status==='cancelled'||!old.status?((sd!==''&&so!==''&&!isNaN(+sd)&&!isNaN(+so))?'final':'scheduled'):old.status);
    Repo.upsert({...old,id,type,date:v('date'),time:v('time'),title,place:customVal('place'),homeAway,program:v('program'),channel:v('channel'),players:editing?.kboGameId?(old.players||[]):v('players').split(',').map(x=>x.trim()).filter(Boolean),desc:v('desc'),opp,cancelReason,cancelled,status,cancellationOverride,venue:customVal('place'),oppStarter:v('oppStarter'),starter:v('starter'),score:(sd!==''&&so!==''&&!isNaN(+sd)&&!isNaN(+so))?{d:+sd,v:+so}:null,stage:v('stage'),gameNo:$('#f_gno')?(gn?+gn:0):(old.gameNo||0),series:f('series'),duration:f('duration'),winP:f('winP'),loseP:f('loseP'),saveP:f('saveP'),holdP:f('holdP'),gwRbi:f('gwRbi'),doubles:f('doubles'),triples:f('triples'),hits:f('hits'),steals:f('steals'),hrEntries,homeRuns}).then(()=>{editing=null;adminView='manage';keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'소유자만 수정할 수 있습니다')));
  }
  else if(t.id==='cancel'){editing=null;adminView='manage';keep()}
  else if(t.dataset.hideAuto){if(confirm('이 자동연동 일정을 숨길까요?\n숨긴 뒤에도 자동연동으로 다시 나타나지 않습니다.'))Repo.hideAuto(t.dataset.hideAuto).then(()=>keep()).catch(e=>alert('숨기지 못했습니다: '+(e.message||'')))}
  else if(t.dataset.restoreAuto){Repo.restoreAuto(t.dataset.restoreAuto).then(()=>keep()).catch(e=>alert('복원하지 못했습니다: '+(e.message||'')))}
  else if(t.dataset.edit){adminFormStep=1;eduDraft=null;editing=Repo.all().find(x=>x.id===t.dataset.edit);adminView='form';keep()}
  else if(t.dataset.del){const target=Repo.all().find(x=>x.id===t.dataset.del);if(target?.kboGameId){alert('KBO 자동 기록은 여기서 삭제하지 않습니다.');return}if(confirm('삭제할까요?')){Repo.remove(t.dataset.del).catch(e=>alert('삭제하지 못했습니다: '+(e.message||''))).finally(keep)}}
});

/* ============ 3. PWA (아이콘/manifest 런타임 생성) ============ */
try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#131230';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='800 92px -apple-system,sans-serif';x.textAlign='center';x.fillText('B',90,118);
  x.fillStyle='#e5322d';x.fillRect(50,134,80,8);const url=c.toDataURL('image/png');
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=url;document.head.appendChild(l);
  const m={name:'BEARStat',short_name:'BEARStat',display:'standalone',start_url:location.href.split('#')[0],background_color:'#f4f5f9',theme_color:'#131230',icons:[{src:url,sizes:'180x180',type:'image/png'}]};
  const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(ml);
}catch(e){}
