<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BEARSchedule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#131230">
<title>BEARSchedule</title>
<style>
:root{box-sizing:border-box;--bg:#f4f5f9;--card:#fff;--ink:#14142b;--sub:#6b6f85;--line:#e6e8ef;--navy:#131230;--acc:#e5322d;--win:#1a7f4b;--lose:#c0392b;--chip:#eceefa;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d1a;--card:#181829;--ink:#f1f2fa;--sub:#9a9eb6;--line:#2a2b40;--navy:#8f95ff;--chip:#24253d}}
:root[data-theme="dark"]{--bg:#0d0d1a;--card:#181829;--ink:#f1f2fa;--sub:#9a9eb6;--line:#2a2b40;--navy:#8f95ff;--chip:#24253d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}.logo b{color:var(--acc)}
.demo{font-size:10px;font-weight:700;background:var(--chip);color:var(--navy);padding:3px 7px;border-radius:99px}
h2{font-size:12px;letter-spacing:1.2px;color:var(--sub);margin:20px 2px 8px;font-weight:700}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(20,20,60,.05)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px}
.badge{background:var(--navy);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vs{display:flex;align-items:baseline;gap:8px}.vs .t{font-size:22px;font-weight:800;letter-spacing:-.5px}.vs .v{color:var(--sub);font-size:13px}
.time{font-size:30px;font-weight:800;color:var(--navy);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:56px 1fr;gap:5px 8px;font-size:13.5px}.meta span:nth-child(odd){color:var(--sub)}
.score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.res{font-size:13px;font-weight:800;margin-left:8px}.W{color:var(--win)}.L{color:var(--lose)}.D{color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:14px}
.tbd{color:var(--sub)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:16px}.ib{border:0;background:var(--chip);color:var(--navy);border-radius:10px;height:34px;min-width:34px;font-size:15px;font-weight:700;padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}
.dow{font-size:11px;color:var(--sub);padding:4px 0}
.d{height:44px;border:0;background:none;color:var(--ink);font-size:14px;border-radius:12px;position:relative;font-family:inherit}
.d.o{color:var(--sub);opacity:.45}.d.sun{color:var(--acc)}
.d.today{font-weight:800;box-shadow:inset 0 0 0 1.5px var(--navy)}
.d.sel{background:var(--navy);color:var(--bg);font-weight:800}
.d i{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.d.sel i{background:var(--bg)}
.ev{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.ev:first-child{border-top:0;padding-top:2px}
.ev .tm{width:46px;font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.ev .bd{flex:1;min-width:0}.ev .ti{font-weight:700;font-size:15px}.ev .sb{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.5}
.tag{display:inline-block;font-size:10.5px;font-weight:700;background:var(--chip);color:var(--navy);padding:2px 7px;border-radius:99px;margin-right:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav a{flex:1;text-align:center;padding:12px 0 11px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none}
nav a.on{color:var(--navy);box-shadow:inset 0 2px 0 var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--sub);text-align:right;padding:6px 4px;font-weight:600}td{padding:11px 4px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}tr.me td{background:var(--chip);font-weight:800;color:var(--navy)}tr.me td:first-child{border-radius:10px 0 0 10px}tr.me td:last-child{border-radius:0 10px 10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:0;background:var(--card);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink);font-family:inherit;box-shadow:0 1px 2px rgba(20,20,60,.05)}
.chip.on{background:var(--navy);color:var(--bg)}
.big{font-size:28px;font-weight:800;color:var(--navy)}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:22px}.foot a{color:var(--sub)}
label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;background:var(--navy);color:var(--bg);font-weight:800;border-radius:14px;padding:13px;width:100%;font-size:15px;margin-top:16px;font-family:inherit}
.btn.g{background:var(--chip);color:var(--navy)}
.note{font-size:12px;color:var(--sub);line-height:1.55;background:var(--chip);border-radius:12px;padding:10px 12px;margin:10px 0}
.link{border:0;background:none;color:var(--acc);font-weight:700;font-size:12.5px;padding:4px 0;margin-right:12px;font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ▼▼ Supabase 설정 (README 참고). 비워두면 DEMO 조회 전용으로 동작 ▼▼ */
const SUPABASE_URL="https://maxtwmgfobrnpxbjdzjl.supabase.co",SUPABASE_KEY="sb_publishable_6ZxZjyKxvsUspmmG6K8RPg_xq_sL6Qu";
/* ============ 1. 데이터 계층 (웹/iOS 위젯 공유 스키마) ============
 * Event = {id,date,type,title,time,opp,venue,starter,score:{d,o},stage,gameNo,series,
 *          broadcast,players[],program,channel,place,desc,demo}
 * type: kbo|futures|edu|club|fan|broadcast|radio|ticket|etc
 * 실서비스: 이 Repo를 REST API(/api/events?from=&to=)로 교체하면 웹·WidgetKit이 같은 JSON을 사용.
 */
const TEAMS=['LG','KT','SSG','NC','KIA','롯데','삼성','한화','키움'];
const TYPES={kbo:'KBO',futures:'FUTURES',edu:'교육리그',club:'구단 행사',fan:'팬 행사',broadcast:'방송',radio:'라디오/유튜브',ticket:'티켓 예매',etc:'기타'};
const VENUES=['서울종합운동장 야구장','수원 케이티 위즈 파크','인천 SSG 랜더스필드','창원NC파크','광주-기아 챔피언스 필드','사직 야구장','대구 삼성 라이온즈 파크','대전 한화생명 볼파크','고척 스카이돔','이천 베어스 파크','고양 국가대표 야구 훈련장','서산전용연습구장','LG 챔피언스 파크','강화 SSG 퓨처스필드','문경 상무 야구장','상동 야구장','삼성 라이온즈 볼파크','울산 문수 야구장','기아 챌린저스 필드','익산 국가대표 야구훈련장','마산 야구장'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const H=n=>((n*2654435761)>>>0)%100;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TS=ymd(TODAY);

const DEMO=[]; // 실제 일정은 관리자 화면에서 직접 등록

/* 권한: 쓰기는 Supabase RLS(admins 테이블에 등록된 계정만)가 서버에서 강제합니다.
 * isOwner는 화면 표시용일 뿐 보안 경계가 아닙니다. */
let isOwner=false,CUSTOM=[],SB=null;
const live=()=>CUSTOM.some(e=>e.source==='kbo');
const Repo={
  all(){const a=DEMO.concat(CUSTOM),k=e=>e.date+e.type,isG=e=>e.type==='kbo'||e.type==='futures',lv=CUSTOM.some(e=>e.source==='kbo'),real=new Set(a.filter(e=>!e.demo&&isG(e)).map(k));
    return a.filter(e=>!(e.demo&&isG(e)&&(lv||real.has(k(e)))))}, // 실제 수집 데이터가 있으면 DEMO 경기는 모두 숨김
  custom(){return CUSTOM},
  async saveOthers(rows){if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('kv').upsert({key:'standings_others',body:rows});if(r.error)throw r.error;OTHERS=rows;rerender()},
  async load(){const r=await SB.from('events').select('body');if(!r.error)CUSTOM=r.data.map(x=>x.body);
    const k=await SB.from('kv').select('body').eq('key','standings_others');if(!k.error&&k.data.length)OTHERS=k.data[0].body;rerender()},
  async upsert(ev){if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').upsert({id:ev.id,date:ev.date,body:ev});if(r.error)throw r.error;await this.load()},
  async remove(id){if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').delete().eq('id',id);if(r.error)throw r.error;await this.load()}
};
function rerender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;const y=scrollY;route2();scrollTo(0,y)}
async function setUser(sess){
  isOwner=false;
  if(sess){const r=await SB.from('admins').select('user_id').eq('user_id',sess.user.id);isOwner=!r.error&&r.data.length>0}
  rerender();
}
(async()=>{try{
  if(!window.supabase||!SUPABASE_URL)return;
  SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await Repo.load();
  SB.auth.onAuthStateChange((_e,sess)=>{setUser(sess)});
  const {data}=await SB.auth.getSession();await setUser(data.session);
}catch(e){}})();
const byDate=ds=>Repo.all().filter(e=>e.date===ds).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const result=e=>!e.score?null:e.score.d>e.score.o?'W':e.score.d<e.score.o?'L':'D';
const RL={W:'승',L:'패',D:'무'};

/* ============ 2. UI ============ */
const $=s=>document.querySelector(s);
let sel=TS,view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),h2h=null,editing=null;

function gameCard(e,kind){
  if(!e)return `<div class="card"><div class="empty">오늘 경기가 없습니다.</div></div>`;
  const r=result(e),sub=[e.stage,e.gameNo?e.gameNo+'차전':''].filter(Boolean).join(' · ');
  const st=e.starter||'';
  return `<div class="card"><div class="top"><span>${e.venue||''}${e.homeAway?` <span class="tag">${e.homeAway==='home'?'홈':'원정'}</span>`:''}</span><span>${e.stage?`<span class="badge">${sub}</span>`:kind==='kbo'?'정규시즌':'퓨처스리그'}${e.series?` <span class="tag" style="margin:0 0 0 4px">${e.series}</span>`:''}</span></div>
  <div class="vs"><span class="t">${e.opp}</span><span class="v">vs 두산</span></div>
  ${r?`<div class="score">${e.score.d} : ${e.score.o}<span class="res ${r}">${RL[r]}</span></div>`:`<div class="time">${e.time||'<span class=tbd>시간 미정</span>'}</div>`}
  <div class="meta"><span>경기장</span><span>${e.venue||'미정'}</span><span>${kind==='kbo'?'선발':'선발/라인업'}</span><span>${st||'<span class=tbd>선발 투수 미정</span>'}</span>${e.broadcast?`<span>중계</span><span>${e.broadcast}</span>`:''}</div></div>`;
}
function evRow(e){
  let sb='';
  if(e.type==='kbo'||e.type==='futures'||e.type==='edu'){const r=result(e);sb=[e.venue,e.score?`${e.score.d}:${e.score.o} ${RL[r]}`:'',e.stage?[e.stage,e.gameNo?e.gameNo+'차전':''].join(' '):'',e.starter,e.broadcast].filter(Boolean).join(' · ');}
  else if(e.type==='broadcast'||e.type==='radio')sb=[e.program,e.players&&e.players.join(', '),e.channel].filter(Boolean).join(' · ');
  else sb=[e.place].filter(Boolean).join(' · ');
  return `<div class="ev"><div class="tm">${e.time||'--:--'}</div><div class="bd"><div class="ti"><span class="tag">${TYPES[e.type]||'기타'}</span>${e.title}${e.demo?' <span class="tag">DEMO</span>':''}</div>${sb?`<div class="sb">${sb}</div>`:''}${e.desc?`<div class="sb">${e.desc}</div>`:''}</div></div>`;
}
function calendar(){
  const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=addDays(first,-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){const d=addDays(start,i),ds=ymd(d),has=Repo.all().some(e=>e.date===ds);
    cells+=`<button class="d${d.getMonth()!==m?' o':''}${d.getDay()===0?' sun':''}${ds===TS?' today':''}${ds===sel?' sel':''}" data-d="${ds}">${d.getDate()}${has?'<i></i>':''}</button>`;}
  return `<div class="card"><div class="calhead"><button class="ib" data-m="-1">‹</button><b>${y}년 ${m+1}월</b><span><button class="ib" data-m="0">오늘</button> <button class="ib" data-m="1">›</button></span></div>
  <div class="grid">${'일월화수목금토'.split('').map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`;
}
function home(){
  const t=byDate(TS),kbo=t.find(e=>e.type==='kbo'),fu=t.find(e=>e.type==='futures');
  const evs=byDate(sel),sd=new Date(sel+'T00:00:00');
  return `<div class="brand"><div class="logo">BEARS<b>chedule</b></div></div>
  <h2>KBO</h2>${gameCard(kbo,'kbo')}<h2>FUTURES</h2>${gameCard(fu,'futures')}
  <h2>CALENDAR</h2>${calendar()}
  <h2>${sd.getMonth()+1}월 ${sd.getDate()}일 (${'일월화수목금토'[sd.getDay()]}) 일정</h2>
  <div class="card">${evs.length?evs.map(evRow).join(''):'<div class="empty">일정이 없습니다.</div>'}</div>
  <div class="foot"><a href="#/admin">관리자</a></div>`;
}
let OTHERS=[]; // 다른 구단 시즌 성적 [{n,w,d,l}] (관리자 입력)
standings(){
  const yr=String(TODAY.getFullYear());

  const calc=games=>{
    const c={w:0,d:0,l:0};

    games.forEach(e=>{
      const r=result(e);
      c[r==='W'?'w':r==='L'?'l':'d']++;
    });

    const g=c.w+c.d+c.l;
    const p=c.w+c.l ? c.w/(c.w+c.l) : 0;

    return {...c,g,p};
  };

  const games=Repo.all().filter(
    e=>e.type==='kbo' &&
       e.score &&
       !e.stage &&
       e.date.slice(0,4)===yr
  );

  const c=calc(games);
  const home=calc(games.filter(e=>e.homeAway==='home'));
  const away=calc(games.filter(e=>e.homeAway==='away'));

  const fmt=p=>p>=1?'1.000':p.toFixed(3).slice(1);

  const rows=[{n:'두산',...c}]
    .concat(TEAMS.map(n=>{
      const o=OTHERS.find(x=>x.n===n)||{};
      return {
        n,
        w:o.w||0,
        d:o.d||0,
        l:o.l||0
      };
    }))
    .map(r=>({
      ...r,
      g:r.w+r.d+r.l,
      p:r.w+r.l ? r.w/(r.w+r.l) : 0
    }))
    .sort((a,b)=>b.p-a.p||b.w-a.w);

  return `
    <div class="brand">
      <div class="logo">순위</div>
    </div>

    <div class="card">
      <table>
        <tr>
          <th>순위</th>
          <th>팀</th>
          <th>경기</th>
          <th>승</th>
          <th>무</th>
          <th>패</th>
          <th>승률</th>
        </tr>

        ${rows.map((r,i)=>`
          <tr class="${r.n==='두산'?'me':''}">
            <td>${i+1}</td>
            <td>${r.n==='두산'?'두산베어스':r.n}</td>
            <td>${r.g}</td>
            <td>${r.w}</td>
            <td>${r.d}</td>
            <td>${r.l}</td>
            <td>${fmt(r.p)}</td>
          </tr>
        `).join('')}
      </table>
    </div>

    <h2>홈 / 원정 성적</h2>

    <div class="card">
      <div class="meta">
        <span>홈</span>
        <span>${home.w}승 ${home.d}무 ${home.l}패 · 승률 ${fmt(home.p)}</span>

        <span>원정</span>
        <span>${away.w}승 ${away.d}무 ${away.l}패 · 승률 ${fmt(away.p)}</span>
      </div>
    </div>

    <div class="foot">
      두산은 등록한 경기 결과로 자동 계산 · 다른 구단은 관리자가 입력한 성적 기준
    </div>
  `;
}
function h2hView(){
  const kb=Repo.all().filter(e=>e.type==='kbo');
  let body='';
  if(h2h){
    const g=kb.filter(e=>e.opp===h2h).sort((a,b)=>a.date.localeCompare(b.date)),done=g.filter(e=>e.score),left=g.filter(e=>!e.score);
    const c={W:0,L:0,D:0};done.forEach(e=>c[result(e)]++);
    const row=e=>{const r=result(e);return `<div class="ev"><div class="tm">${e.date.slice(5).replace('-','.')}</div><div class="bd"><div class="ti">${e.score?`${e.score.d}:${e.score.o} <span class="res ${r}" style="margin:0">${RL[r]}</span>`:e.time}</div><div class="sb">${e.venue}${e.stage?' · '+e.stage:''}</div></div></div>`};
    body=`<div class="card" style="margin-top:14px"><div class="top"><span>시즌 상대전적 · 두산 vs ${h2h}</span></div><div class="big">${c.W}승 ${c.D}무 ${c.L}패</div></div>
    <h2>진행된 경기</h2><div class="card">${done.length?done.slice().reverse().map(row).join(''):'<div class="empty">진행된 경기가 없습니다.</div>'}</div>
    <h2>남은 일정</h2><div class="card">${left.length?left.map(row).join(''):'<div class="empty">남은 경기가 없습니다.</div>'}</div>`;
  }
  return `<div class="brand"><div class="logo">상대전적</div></div><div class="chips">${TEAMS.map(t=>`<button class="chip${t===h2h?' on':''}" data-t="${t}">${t}</button>`).join('')}</div>${body||'<div class="empty">상대팀을 선택하세요.</div>'}`;
}
function admin(){
  if(!isOwner)return `<div class="brand"><div class="logo">관리자</div></div><div class="card">${SB?`<label>이메일</label><input id="em" type="email" autocomplete="username"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="login">로그인</button>${SB&&document.body.dataset.r==='admin'&&isOwner===false?'':''}`:'<div class="empty">Supabase 설정 후 사용할 수 있습니다.</div>'}<div class="note">일정 수정은 관리자로 등록된 계정만 가능하며 서버에서 확인합니다. <a href="#/">← 돌아가기</a></div></div>`;
  const e=editing||{type:'kbo',date:TS,time:'',title:'',place:'',homeAway:'',program:'',channel:'',players:[],desc:''}
  return `<div class="brand"><div class="logo">관리자</div><a href="#/" class="demo" style="text-decoration:none">← 앱</a></div>
  <button class="btn g" id="logout" style="margin:0 0 12px">로그아웃</button><div class="card"><b>${editing?'일정 수정':'일정 추가'}</b>
  <label>종류</label><select id="f_type">${['kbo','futures','club','fan','broadcast','radio','ticket','edu','etc'].map(k=>`<option value="${k}"${e.type===k?' selected':''}>${TYPES[k]}</option>`).join('')}</select>
  <label>날짜</label><input id="f_date" type="date" value="${e.date}"><label>시간</label><input id="f_time" type="time" value="${e.time||''}">
  <label>장소</label><select id="f_place">${['',...VENUES].map(v=>`<option value="${v}" ${e.place===v?'selected':''}>${v||'장소 선택'}</option>`).join('')}</select>
  <label>상대팀 (경기)</label><input id="f_opp" value="${e.opp||''}">
<label>경기장 (경기)</label><input id="f_venue" value="${e.venue||''}">
<label>홈 / 원정</label><select id="f_homeAway">
<option value="">홈/원정 선택</option>
<option value="home"${e.homeAway==='home'?' selected':''}>홈</option>
<option value="away"${e.homeAway==='away'?' selected':''}>원정</option>
</select>
<label>선발 (경기)</label><input id="f_starter" value="${e.starter||''}">
  <label>스코어 두산 : 상대 (종료 시)</label><div style="display:flex;gap:8px"><input id="f_sd" type="number" min="0" value="${e.score?e.score.d:''}"><input id="f_so" type="number" min="0" value="${e.score?e.score.o:''}"></div>
  <label>포스트시즌 단계 / 차전 / 시리즈 전적</label><div style="display:flex;gap:8px"><select id="f_stage"><option value="">정규시즌</option>${['시범경기','와일드카드','준플레이오프','플레이오프','한국시리즈','관련 없음'].map(x=>`<option${e.stage===x?' selected':''}>${x}</option>`).join('')}</select><input id="f_gno" type="number" min="1" placeholder="차전" value="${e.gameNo||''}"></div><input id="f_series" placeholder="1승 0패" value="${e.series||''}" style="margin-top:8px">
  <label>프로그램명</label><input id="f_program" value="${e.program||''}"><label>방송사</label><input id="f_channel" value="${e.channel||''}">
  <label>관련 선수 (쉼표 구분)</label><input id="f_players" value="${(e.players||[]).join(', ')}"><label>설명</label><textarea id="f_desc" rows="2">${e.desc||''}</textarea>
  <button class="btn" id="save">${editing?'수정 저장':'추가'}</button>${editing?'<button class="btn g" id="cancel">취소</button>':''}</div>
  <h2>다른 구단 시즌 성적 (순위표용)</h2><div class="card">${TEAMS.map(t=>{const o=OTHERS.find(x=>x.n===t)||{w:'',d:'',l:''};return `<div class="ev" style="align-items:center"><div class="tm" style="width:52px">${t}</div><div class="bd" style="display:flex;gap:6px"><input data-o="${t}" data-k="w" type="number" min="0" placeholder="승" value="${o.w}"><input data-o="${t}" data-k="d" type="number" min="0" placeholder="무" value="${o.d}"><input data-o="${t}" data-k="l" type="number" min="0" placeholder="패" value="${o.l}"></div></div>`}).join('')}<button class="btn" id="saveo">순위 성적 저장</button><div class="note">두산 성적은 등록한 경기 결과로 자동 계산됩니다. 순위·경기수·승률도 자동 계산됩니다.</div></div>
  <h2>직접 등록한 일정</h2><div class="card">${list.length?list.map(x=>`<div class="ev"><div class="tm">${x.date.slice(5)}</div><div class="bd"><div class="ti">${x.title}</div><div class="sb">${TYPES[x.type]}</div><button class="link" data-edit="${x.id}">수정</button><button class="link" data-del="${x.id}">삭제</button></div></div>`).join(''):'<div class="empty">등록한 일정이 없습니다.</div>'}</div>
  `;
}

function route(){
  const r=location.hash.replace('#/','')||'home';
  $('#app').innerHTML=r==='standings'?standings():r==='h2h'?h2hView():r==='admin'?admin():home();
  $('#nav').innerHTML=[['home','홈'],['standings','순위'],['h2h','상대전적']].map(([k,l])=>`<a href="#/${k==='home'?'':k}" class="${r===k?'on':''}">${l}</a>`).join('');
  document.body.dataset.r=r;window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-d],[data-m],[data-t],[data-edit],[data-del],#save,#saveo,#cancel,#login,#logout');if(!t)return;
  const keep=()=>{const y=scrollY;route2();scrollTo(0,y)};
  if(t.dataset.d){sel=t.dataset.d;const d=new Date(sel+'T00:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);keep()}
  else if(t.dataset.m!==undefined){const m=+t.dataset.m;if(m===0){sel=TS;view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1)}else view=new Date(view.getFullYear(),view.getMonth()+m,1);keep()}
  else if(t.dataset.t){h2h=t.dataset.t;keep()}
  else if(t.id==='login'){SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(r=>{if(r.error)alert('로그인 실패: '+r.error.message)})}
  else if(t.id==='logout'){SB.auth.signOut()}
  else if(t.id==='saveo'){const rows=TEAMS.map(n=>{const g=k=>+(document.querySelector(`[data-o="${n}"][data-k="${k}"]`).value||0);return{n,w:g('w'),d:g('d'),l:g('l')}});
    Repo.saveOthers(rows).then(()=>{alert('저장했습니다');keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'')))}
  else if(t.id==='save'){
    const v=k=>$('#f_'+k).value.trim(),type=v('type'),opp=v('opp'),homeAway=v('homeAway'),g=type==='kbo'||type==='futures';
    if(g&&!homeAway){alert('경기는 홈/원정을 선택해주세요');return}
    const title=v('title')||(g&&opp?(type==='futures'?'FUTURES ':'')+'두산 vs '+opp:'');
    if(!title||!v('date')){alert('날짜와 제목(경기는 상대팀)은 필수입니다');return}
    const sd=v('sd'),so=v('so'),gn=v('gno'),id=editing?editing.id:'c'+Date.now();
    Repo.upsert({id,type,date:v('date'),time:v('time'),title,place:v('place'),homeAway,program:v('program'),channel:v('channel'),
      .then(()=>{editing=null;keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'소유자만 수정할 수 있습니다')));}
  else if(t.id==='cancel'){editing=null;keep()}
  else if(t.dataset.edit){editing=Repo.custom().find(x=>x.id===t.dataset.edit);keep()}
  else if(t.dataset.del){if(confirm('삭제할까요?')){Repo.remove(t.dataset.del).catch(e=>alert('삭제하지 못했습니다: '+(e.message||''))).finally(keep)}}
});
function route2(){const r=document.body.dataset.r;$('#app').innerHTML=r==='standings'?standings():r==='h2h'?h2hView():r==='admin'?admin():home();}
addEventListener('hashchange',route);route();

try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#131230';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='800 92px -apple-system,sans-serif';x.textAlign='center';x.fillText('B',90,118);
  x.fillStyle='#e5322d';x.fillRect(50,134,80,8);const url=c.toDataURL('image/png');
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=url;document.head.appendChild(l);
  const m={name:'BEARSchedule',short_name:'BEARSchedule',display:'standalone',start_url:location.href.split('#')[0],background_color:'#f4f5f9',theme_color:'#131230',icons:[{src:url,sizes:'180x180',type:'image/png'}]};
  const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(ml);
}catch(e){}
