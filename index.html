<style>
:root{box-sizing:border-box;--bg:#f4f5f9;--card:#fff;--ink:#14142b;--sub:#6b6f85;--line:#e6e8ef;--navy:#131230;--acc:#e5322d;--win:#1a7f4b;--lose:#c0392b;--chip:#eceefa;padding-top:env(safe-area-inset-top,0px)}

#app{max-width:520px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}.logo b{color:var(--acc)}

.demo{font-size:10px;font-weight:700;background:var(--chip);color:var(--navy);padding:3px 7px;border-radius:99px}

.meta{display:grid;grid-template-columns:56px 1fr;gap:5px 8px;font-size:13.5px}.meta span:nth-child(odd){color:var(--sub)}

table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--sub);text-align:right;padding:6px 4px;font-weight:600}td{padding:11px 4px;text-align:right;border-top:1px solid var(--line)}

.sh{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--sub);padding:12px 6px;min-height:44px;width:100%;text-align:inherit;white-space:nowrap}.sh.on{color:var(--navy)}
.recscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative;contain:paint;clip-path:inset(0)}

.recstats{min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0}

.sheetbar{width:42px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 16px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheethead b{font-size:22px}.sheetclose{border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px}

/* ============ 1. 데이터 계층 (웹/iOS 위젯 공유 스키마) ============

const pad=n=>String(n).padStart(2,'0');

const TODAY=new Date();TODAY.setHours(0,0,0,0);const TS=ymd(TODAY);

/* 권한: 쓰기는 Supabase RLS(admins 테이블에 등록된 계정만)가 서버에서 강제합니다.

let isOwner=false,CUSTOM=[],SB=null,BEARS_ROSTER=[],ROSTERS_BY_YEAR={},EDU_ROSTERS_BY_YEAR={},OTHERS_BY_YEAR={},AUTO_STANDINGS_BY_YEAR={},HIDDEN_AUTO_IDS=[];
let adminRosterYear=TODAY.getFullYear(),adminEduRosterYear=TODAY.getFullYear();
let adminCalDate=TS,adminCalView=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),adminSearch='',adminView='manage';
let adminFormStep=1;
function requireAdmin(){if(!isOwner)throw new Error('관리자 로그인 후 사용할 수 있습니다');}
const live=()=>CUSTOM.some(e=>e.source==='kbo');
const Repo={
  all(){const a=DEMO.concat(CUSTOM),k=e=>e.date+e.type,isG=e=>e.type==='kbo',lv=CUSTOM.some(e=>e.source==='kbo'),real=new Set(a.filter(e=>!e.demo&&isG(e)).map(k));
    return a.filter(e=>!(e.demo&&isG(e)&&(lv||real.has(k(e)))))}, // 실제 수집 데이터가 있으면 DEMO 경기는 모두 숨김
  custom(){return CUSTOM},
  async saveRoster(rows,year=adminRosterYear){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');rows=normRoster(rows);const y=+year||TODAY.getFullYear(),key='bears_roster_'+y;const r=await SB.from('kv').upsert({key,body:rows});if(r.error)throw r.error;ROSTERS_BY_YEAR[y]=rows;if(y===TODAY.getFullYear())BEARS_ROSTER=rows;rerender()},
  async saveEduRoster(rows,year=adminEduRosterYear){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');rows=normRoster(rows);const y=+year||TODAY.getFullYear(),key='edu_roster_'+y;const r=await SB.from('kv').upsert({key,body:rows});if(r.error)throw r.error;EDU_ROSTERS_BY_YEAR[y]=rows;rerender()},
  async hideAuto(id){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');const next=[...new Set([...HIDDEN_AUTO_IDS,S(id)].filter(Boolean))];const r=await SB.from('kv').upsert({key:'hidden_auto_events',body:next});if(r.error)throw r.error;HIDDEN_AUTO_IDS=next;rerender()},
  async restoreAuto(id){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');const next=HIDDEN_AUTO_IDS.filter(x=>S(x)!==S(id));const r=await SB.from('kv').upsert({key:'hidden_auto_events',body:next});if(r.error)throw r.error;HIDDEN_AUTO_IDS=next;rerender()},
  async load(){const r=await SB.from('events').select('body');if(!r.error)CUSTOM=r.data.map(x=>x.body);
    const ks=await SB.from('kv').select('key,body').like('key','standings_others%');if(!ks.error){let legacy=null;for(const x of ks.data||[]){if(x.key==='standings_others')legacy=x.body;else{const m=String(x.key).match(/^standings_others_(\d{4})$/);if(m)OTHERS_BY_YEAR[+m[1]]=x.body}}if(!OTHERS_BY_YEAR[TODAY.getFullYear()]&&legacy)OTHERS=legacy;else OTHERS=OTHERS_BY_YEAR[TODAY.getFullYear()]||[]}
    const br=await SB.from('kv').select('key,body').like('key','bears_roster%');if(!br.error){let legacy=null;for(const x of br.data||[]){if(x.key==='bears_roster')legacy=normRoster(x.body);else{const m=String(x.key).match(/^bears_roster_(\d{4})$/);if(m)ROSTERS_BY_YEAR[+m[1]]=normRoster(x.body)}}BEARS_ROSTER=ROSTERS_BY_YEAR[TODAY.getFullYear()]||legacy||[]}
    const er=await SB.from('kv').select('key,body').like('key','edu_roster_%');if(!er.error){for(const x of er.data||[]){const m=String(x.key).match(/^edu_roster_(\d{4})$/);if(m)EDU_ROSTERS_BY_YEAR[+m[1]]=normRoster(x.body)}}
    const asr=await SB.from('kv').select('key,body').like('key','standings_auto_%');if(!asr.error){for(const x of asr.data||[]){const m=String(x.key).match(/^standings_auto_(\d{4})$/);if(m&&Array.isArray(x.body))AUTO_STANDINGS_BY_YEAR[+m[1]]=x.body}}
    const hidden=await SB.from('kv').select('body').eq('key','hidden_auto_events').maybeSingle();if(!hidden.error)HIDDEN_AUTO_IDS=Array.isArray(hidden.data?.body)?hidden.data.body.map(S).filter(Boolean):[];
    rerender()},
  async upsert(ev){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').upsert({id:ev.id,date:ev.date,body:ev});if(r.error)throw r.error;await this.load()},
  async remove(id){requireAdmin();if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').delete().eq('id',id);if(r.error)throw r.error;await this.load()}
};
/* ============ KBO 자동 연동 ============ */
/* 미래 경기 자동 표시:
 * kbo_game_records에 미래 경기 일정이 저장되면 score가 없어도 캘린더/일정에 표시됩니다.
 * 같은 game_id가 경기 종료 후 upsert되면 결과와 선수 기록으로 갱신됩니다.
 */

let KBO_AUTO=[],KBO_WARNING='',KBO_MERGE_WARNINGS=[],FUTURES_PROGRESS_BY_YEAR={},FUTURES_AUTO=[],FUTURES_WARNING='';
// Optional season snapshots in existing kv; never write or change existing tables.
let KBO_SITUATIONAL_BY_YEAR={},KBO_SITUATIONAL_WARNING='';
async function loadKboSituational(){
  if(!SB)return;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{
    const r=await SB.from('kv').select('key,body').like('key','kbo_situational_%').abortSignal(controller.signal);
    if(r.error)throw r.error;
    const next={};
    for(const x of r.data||[]){
      const m=S(x.key).match(/^kbo_situational_(\d{4})$/),b=x.body;
      if(m&&b?.schemaVersion===1&&b.source==='kbo'&&b.scope==='season'&&b.teamId==='OB'&&+b.season===+m[1]&&Array.isArray(b.rows))next[+m[1]]=b;
    }
    KBO_SITUATIONAL_BY_YEAR=next;KBO_SITUATIONAL_WARNING='';
  }catch(e){KBO_SITUATIONAL_WARNING='상황별 기록을 갱신하지 못했습니다.'}
  finally{clearTimeout(timer)}
}

function futuresEvent(row){
  const b=row.body||{},g=row.raw?.game||{},meta=b.kbo||{};
  const away=S(g.AWAY_ID||b.teams?.away?.code),home=S(g.HOME_ID||b.teams?.home?.code);
  if(away!=='OB'&&home!=='OB'){
    if(b.type==='futures'&&b.kbo?.parserVersion)return b;
    return null;
  }
  if(S(meta.seriesId??g.SR_ID)!=='0')return null;
  if(b.type==='futures'&&b.kbo?.parserVersion)return b;
  const id=S(meta.gameId||g.G_ID||b.id),date=S(g.G_DT||row.date||b.date).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!id)return null;
  const isHome=home==='OB',cancel=S(g.CANCEL_SC_ID??b.status?.cancel)!=='0',final=!cancel&&S(g.GAME_STATE_SC??b.status?.state)==='3'&&Number(g.GAME_RESULT_CK??b.status?.result)===1;
  const d=isHome?(g.B_SCORE_CN??b.score?.home):(g.T_SCORE_CN??b.score?.away),v=isHome?(g.T_SCORE_CN??b.score?.away):(g.B_SCORE_CN??b.score?.home);
  const opp=S(isHome?(g.AWAY_NM||b.teams?.away?.name):(g.HOME_NM||b.teams?.home?.name));
  return {id:'futures-'+id,type:'futures',source:'futures',kboGameId:id,date,title:'두산 vs '+opp,opp,
    homeAway:isHome?'home':'away',time:S(g.G_TM),venue:S(g.S_NM),place:S(g.S_NM),stage:'',headerNo:Number(g.HEADER_NO)||0,
    status:cancel?'cancelled':final?'final':'scheduled',cancelReason:cancel?S(g.CANCEL_SC_NM):'',
    score:final&&S(d)!==''&&S(v)!==''?{d:Number(d),v:Number(v)}:null,
    kbo:{...meta,leagueId:2,seriesId:0},batting:[],pitching:[]};
}
async function loadFuturesGames(){
  if(!SB)return;
  try{
    const next=new Map();
    for(let start=0;;start+=500){
      const r=await SB.from('futures_game_records').select('game_id,date,body').order('game_id').range(start,start+499);
      if(r.error)throw r.error;
      for(const row of r.data||[]){const b=row.body;if(b?.type!=='futures'||b.source!=='futures'||S(b.kbo?.leagueId)!=='2'||S(b.kbo?.seriesId)!=='0'||b.kboGameId!==row.game_id||b.date!==row.date)continue;const event=futuresEvent(row);if(event)next.set(event.kboGameId,event);}
      if((r.data||[]).length<500)break;
    }
    FUTURES_AUTO=[...next.values()];FUTURES_WARNING='';
  }catch{FUTURES_WARNING='퓨처스 자동 기록을 갱신하지 못했습니다.';}
}
async function loadFuturesProgress(){
  if(!SB)return;
  try{const r=await SB.from('kv').select('key,body').like('key','futures_sync_%');if(r.error)return;
    const next={};for(const x of r.data||[]){const m=S(x.key).match(/^futures_sync_(\d{4})$/);if(m&&x.body?.source==='futures'&&x.body.schemaVersion===1)next[+m[1]]=x.body;}FUTURES_PROGRESS_BY_YEAR=next;
  }catch{}
}
function futuresRecordNote(){
  const events=Repo.all().filter(e=>e.type==='futures'&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===String(recYear));
  const collected=events.filter(e=>e.batting?.length&&e.pitching?.length).length,state=FUTURES_PROGRESS_BY_YEAR[recYear];
  return `수집된 ${collected}경기 기준${state&&!state.complete?' · 이전 경기 수집 중':''}${events.length>collected?' · 일부 경기 선수 기록 대기':''}${FUTURES_WARNING?' · 자동 갱신 실패, 이전 기록 표시':''}`;
}

function mergeEvents(manual,automatic){
  const rows=manual.map(e=>({...e})),warnings=[];
  const same=(m,a)=>m.type===a.type&&m.date===a.date&&m.opp===a.opp&&(!m.homeAway||m.homeAway===a.homeAway);
  for(const auto of automatic){
    let matches=rows.filter(m=>m.type===auto.type&&(m.kboGameId===auto.kboGameId||m.id===auto.id));
    if(!matches.length){matches=rows.filter(m=>!m.kboGameId&&same(m,auto));if(matches.length&&(matches.length!==1||automatic.filter(a=>same(matches[0],a)).length!==1||auto.headerNo>0)){warnings.push(`${auto.date} ${auto.opp}: 더블헤더 또는 중복 수동 일정 — 경기 ID 연결 필요`);continue}}
    if(matches.length>1){warnings.push(`${auto.kboGameId}: 중복 연결`);continue}
    if(!matches.length){rows.push({...auto});continue}
    const old=matches[0],index=rows.indexOf(old),merged=old.manualOverride?{...auto,...old}:{...old,...auto};
    if(old.manualOverride&&Array.isArray(old.pitching)&&Array.isArray(auto.pitching))merged.pitching=old.pitching.map(p=>{const base=auto.pitching.find(x=>S(x.name)===S(p.name)&&(!S(p.teamId)||S(x.teamId)===S(p.teamId)));return base?{...base,...p}:p});
    for(const key of ['title','desc','channel','program','players','series'])if(old[key]!==undefined&&old[key]!=='')merged[key]=old[key];
    // 경기 취소 설정은 선수 기록의 수동 우선 여부와 별도로 보존합니다.
    if(old.cancellationOverride||(old.cancellationOverride===undefined&&S(old.cancelReason))){
      merged.cancelReason=S(old.cancelReason);merged.cancelled=isCancelled(old);

function seriesBattingForGame(gameDate,opp,homeAway,name,league='kbo'){
  const games=Repo.all()
    .filter(e=>e.type===league&&!e.stage&&!isCancelled(e)&&hasScore(e)&&S(e.opp)===S(opp)&&S(e.homeAway)===S(homeAway)&&Array.isArray(e.batting))
    .sort((a,b)=>S(a.date).localeCompare(S(b.date)));

  const idx=games.findIndex(e=>S(e.date)===S(gameDate));
  if(idx<0)return null;

  let start=idx,end=idx;
  const dayDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00')-Date.parse(a+'T00:00:00'))/86400000);

  while(start>0 && dayDiff(S(games[start-1].date),S(games[start].date))<=3) start--;
  while(end<games.length-1 && dayDiff(S(games[end].date),S(games[end+1].date))<=3) end++;

  const series=games.slice(start,end+1);
  let ab=0,hit=0,played=0;
  series.forEach(e=>{
    const p=e.batting.find(x=>S(x.name)===S(name));
    if(!p)return;
    ab+=+p.atBats||0;
    hit+=+p.hits||0;
    played++;
  });

  if(!played)return null;
  return {ab,hit,games:series.length,played,from:S(series[0].date),to:S(series[series.length-1].date)};
}

  };

        else if(stat==='d3') count=manualCount(e,'triples');
        else if(stat==='sb') count=manualCount(e,'steals');

    });

}

async function loadOrderGamePlays(row,name,key){

  if(recLeague!=='kbo'||!/^\d{8}[A-Z]{4}\d$/.test(id)||cachedPlayerRelay(id,name,'hitter')||ORDER_PLAY_REQUESTS.get(key)?.loading)return;
  const state={loading:true,error:false};ORDER_PLAY_REQUESTS.set(key,state);
  try{await primePlayerRelay([id],name,'hitter');await readSituationRelay(id,name,'hitter');}
  catch{state.error=true;}
  finally{state.loading=false;if(playerSheet===name&&orderPlayOpen===key)rerender();}
}

let recSituation={hitter:{dimension:'runners',value:'주자없음'},pitcher:{dimension:'runners',value:'주자없음'}};
const SPLIT_ALIASES={ab:['AB','atBats','atBatsAgainst','ab'],hit:['H','hits','hitsAllowed','hit'],d2:['2B','doubles','doublesAllowed','d2'],d3:['3B','triples','triplesAllowed','d3'],hr:['HR','homeRuns','homeRunsAllowed','hr'],rbi:['RBI','rbi'],bb:['BB','walks','bb'],hbp:['HBP','hitByPitch','hitBatters','hbp'],so:['SO','strikeouts','strikeOuts','so'],gdp:['GDP','groundedIntoDoublePlay','gdp'],wp:['WP','wildPitches','wp'],bk:['BK','balks','bk'],avg:['AVG','avg','battingAverage','averageAgainst']};
function recordNumber(p,keys){
  for(const k of keys){const v=p?.[k];if(v!==null&&v!==undefined&&S(v)!==''&&Number.isFinite(+v)&&+v>=0)return +v}
  return null;
}
function normalizeSituation(d,value){
  let v=S(value).replace(/\s/g,'').replace(/，/g,',').replace(/～/g,'~');
  if(d==='order')v=v.replace(/^([1-9])번$/, '$1번타자');
  return v;
}
function normalizedSplit(raw,name){
  const stats=raw.stats&&typeof raw.stats==='object'?raw.stats:raw,r={n:name};
  for(const [k,keys] of Object.entries(SPLIT_ALIASES))r[k]=recordNumber(stats,keys);
  // Pitcher AVG denominator is AB against, not innings or batters faced.
  if(r.ab!==null&&r.hit!==null)r.avg=r.ab>0?r.hit/r.ab:null;
  if(r.avg!==null&&r.avg>1)r.avg=null;
  return r;
}
function situationalRows(){
  const state=recSituation[recKind],roster=recordRoster(),allowed=new Set(roster.filter(x=>x.t===recKind).map(x=>x.n)),out=new Map();
  const matches=x=>x&&x.role===recKind&&x.dimension===state.dimension&&normalizeSituation(state.dimension,x.situation)===state.value;
  // Latest complete season snapshot wins for each player/category, avoiding double counting.
  const snapshot=recLeague==='kbo'&&recSeason==='regular'?KBO_SITUATIONAL_BY_YEAR[recYear]:null;
  for(const raw of snapshot?.rows||[]){const n=S(raw.name);if(matches(raw)&&allowed.has(n))out.set(n,normalizedSplit(raw,n))}
  const daily=new Map(),incomplete=new Set();
  for(const e of Repo.all().filter(e=>e.type===recLeague&&!isCancelled(e)&&recordSeasonMatches(e)&&!isExhibition(e)&&hasScore(e)&&S(e.date).slice(0,4)===String(recYear))){
    for(const p of (Array.isArray(e[recKind==='hitter'?'batting':'pitching'])?e[recKind==='hitter'?'batting':'pitching']:[])){
      const n=S(p.name);if(!allowed.has(n)||out.has(n))continue;
      if(p.situationalComplete!==true){incomplete.add(n);continue}
      // Explicit daily split data only. BB must include intentional walks once.
      for(const raw of Array.isArray(p.situational)?p.situational:[]){
        if(!matches({...raw,role:recKind}))continue;
        const r=normalizedSplit(raw,n);if(!daily.has(n))daily.set(n,[]);daily.get(n).push(r);
      }
    }
  }
  for(const [n,parts] of daily){
    if(incomplete.has(n))continue;
    const r={n};
    for(const k of Object.keys(SPLIT_ALIASES).filter(k=>k!=='avg'))r[k]=parts.every(x=>x[k]!==null)?parts.reduce((sum,x)=>sum+x[k],0):null;
    r.avg=r.ab!==null&&r.ab>0&&r.hit!==null?r.hit/r.ab:null;
    out.set(n,r);
  }
  if(recKind==='hitter'&&['inning','order'].includes(state.dimension)){for(const r of hitterExtraSplitRows())if(!out.has(r.n))out.set(r.n,r);}
  return [...out.values()].filter(r=>r.pending||r.incomplete||Object.keys(SPLIT_ALIASES).some(k=>r[k]!==null)).map(pitcherSituationAtBats);
}
function splitValue(v,avg=false){return v===null||v===undefined?'—':avg?(v===1?'1.000':v.toFixed(3).replace(/^0/,'')):String(v)}
function recordTableStart(cols,ranked=false,names=[]){
  const nameWidth=Math.max(68,...names.map(n=>Array.from(String(n)).length*14+8));
  // Short result tables fill the card; only the player column has a fixed width.
  if(!ranked&&cols.length<=5)return `<table class="rec recstats recshort" style="width:100%"><colgroup>${cols.map(([key])=>key==='n'?`<col style="width:${nameWidth}px">`:'<col>').join('')}</colgroup>`;
  const widths=cols.map(([key,label])=>key==='n'?nameWidth:key==='era'?72:['starterEra','reliefEra'].includes(key)?64:Math.max(56,Array.from(label).length*13+16));
  if(ranked)widths.unshift(34);
  return `<table class="rec recstats${ranked?' recsitu':''}" style="width:${widths.reduce((a,b)=>a+b,0)}px"><colgroup>${widths.map(w=>`<col style="width:${w}px">`).join('')}</colgroup>`;
}

let situationRelayJob=null;
const RELAY_SUPPORTED=new Set(['avg','ab','hit','d2','d3','hr','bb','hbp','so','gdp']);
function relayMatches(p,state){
 const v=state.value;
 if(state.dimension==='runners'){const labels=['주자없음','1루','2루','1,2루','3루','1,3루','2,3루','만루'];return v==='주자있음'?p.runners>0:v==='득점권'?!!(p.runners&6):labels[p.runners]===v;}
 if(state.dimension==='outs')return v===p.outs+'아웃';
 if(state.dimension==='count')return v===p.count;
 if(state.dimension==='pitcherType')return v===p.pitcherType;
 if(state.dimension==='batterType')return v===p.batterType;
 if(state.dimension==='inning')return v==='연장'?p.inning>=10:v==='4~6회'?p.inning>=4&&p.inning<=6:v==='7회이후'?p.inning>=7:v===p.inning+'회';
 if(state.dimension==='order')return v==='상위(1~2번)'?p.order>=1&&p.order<=2:v==='중심(3~5번)'?p.order>=3&&p.order<=5:v==='하위(6~9번)'?p.order>=6&&p.order<=9:v===p.order+'번타자';
 return false;
}
function situationRelayCandidates(name,stat){
 const key=recKind==='hitter'?'batting':'pitching';
 return Repo.all().filter(e=>e.type==='kbo'&&!isCancelled(e)&&recordSeasonMatches(e)&&!isExhibition(e)&&hasScore(e)&&S(e.date).slice(0,4)===String(recYear)&&/^\d{8}[A-Z]{4}\d$/.test(S(e.kboGameId))&&(e[key]||[]).some(p=>{
  if(S(p.name)!==S(name))return false;
  const n=recordNumber(p,SPLIT_ALIASES[stat==='avg'?'ab':stat]||[]);
  return n===null||n>0||(stat==='bb'&&Number(p.intentionalWalks)>0);
 })).sort((a,b)=>b.date.localeCompare(a.date));
}
const RELAY_PLAYER_CACHE=new Map();
const relayPlayerKey=(id,name,role)=>JSON.stringify([id,name,role]);
function cachedPlayerRelay(id,name,role){return SITUATION_RELAY_CACHE.get(id)||RELAY_PLAYER_CACHE.get(relayPlayerKey(id,name,role));}
const RELAY_REQUEST_QUEUE=[];let relayRequestsActive=0,relayBackgroundActive=0;
function relayRequest(task,priority='interactive',requestKey=''){
 return new Promise((resolve,reject)=>{RELAY_REQUEST_QUEUE.push({task,resolve,reject,priority,requestKey});pumpRelayRequests()});
}
function promoteRelayRequest(key){const item=RELAY_REQUEST_QUEUE.find(item=>item.requestKey===key);if(item){item.priority='interactive';pumpRelayRequests();}}
function pumpRelayRequests(){
 while(relayRequestsActive<2&&RELAY_REQUEST_QUEUE.length){
  // Reserve one request slot for the record the user is opening.
  let index=RELAY_REQUEST_QUEUE.findIndex(item=>item.priority!=='background');
  if(index<0){if(relayBackgroundActive>=1)return;index=0;}
  const [item]=RELAY_REQUEST_QUEUE.splice(index,1),background=item.priority==='background';
  relayRequestsActive++;if(background)relayBackgroundActive++;
  Promise.resolve().then(item.task).then(item.resolve,item.reject).finally(()=>{
   relayRequestsActive--;if(background)relayBackgroundActive--;pumpRelayRequests();
  });
 }
}
async function relayJSON(url,timeout,priority='interactive',requestKey=''){
 return relayRequest(async()=>{
  for(let attempt=0;attempt<2;attempt++){
   try{
    const response=await fetch(url,{headers:{apikey:SUPABASE_KEY},signal:AbortSignal.timeout(timeout)});
    let body;try{body=await response.json()}catch{throw Error('응답 형식 오류 (HTTP '+response.status+')')}
    if(!response.ok){
     const reason=typeof body.error==='string'?body.error:typeof body.message==='string'?body.message:'';
     const error=Error('HTTP '+response.status+(reason?' · '+reason.slice(0,180):''));
     error.retryable=response.status===429||response.status>=500;throw error;
    }
    return body;
   }catch(error){
    const transient=error.retryable||error.name==='TimeoutError'||error.name==='TypeError';
    if(attempt===0&&transient){await new Promise(resolve=>setTimeout(resolve,1000));continue}
    throw error;
   }
  }
 },priority,requestKey);
}
const RELAY_BATCH_INFLIGHT=new Map();
async function primePlayerRelay(ids,name,role,priority='interactive'){
 const missing=[...new Set(ids)].filter(id=>!cachedPlayerRelay(id,name,role));
 for(let i=0;i<missing.length;i+=100){
  const chunk=missing.slice(i,i+100),query=new URLSearchParams({gameIds:chunk.join(','),player:name,role});
  const key=JSON.stringify([name,role,[...chunk].sort()]);
  let pending=RELAY_BATCH_INFLIGHT.get(key);
  if(!pending){
   pending=(async()=>{
    const b=await relayJSON(SUPABASE_URL+'/functions/v1/kbo-relay?'+query,20000,priority,key);
    for(const game of b.games||[])if(chunk.includes(game.gameId)&&game.schemaVersion===1&&Array.isArray(game.plays))RELAY_PLAYER_CACHE.set(relayPlayerKey(game.gameId,name,role),game);
   })();
   RELAY_BATCH_INFLIGHT.set(key,pending);
  }
  if(priority!=='background')promoteRelayRequest(key);
  try{await pending}finally{if(RELAY_BATCH_INFLIGHT.get(key)===pending)RELAY_BATCH_INFLIGHT.delete(key);}
 }
}
async function readSituationRelay(id,name,role,priority='interactive'){
 const existing=cachedPlayerRelay(id,name,role);if(existing)return existing;
 if(RELAY_INFLIGHT.has(id)){if(priority!=='background')promoteRelayRequest('game:'+id);return RELAY_INFLIGHT.get(id);}
 const pending=fetchSituationRelay(id,name,role,priority);RELAY_INFLIGHT.set(id,pending);
 try{return await pending}finally{RELAY_INFLIGHT.delete(id)}
}
async function fetchSituationRelay(id,name,role,priority='interactive'){
 const existing=cachedPlayerRelay(id,name,role);if(existing)return existing;
 const b=await relayJSON(SUPABASE_URL+'/functions/v1/kbo-relay?gameId='+encodeURIComponent(id),90000,priority,'game:'+id);
 if(b.schemaVersion!==1||b.gameId!==id||!Array.isArray(b.plays))throw Error('응답 기록 형식 또는 경기 ID 불일치');
 SITUATION_RELAY_CACHE.set(id,b);return b;
}
function relayPlayerAvailable(relay,id,name,role){
 const ourSide=id.slice(8,10)==='OB'?'away':'home',side=role==='hitter'?ourSide:(ourSide==='away'?'home':'away');
 const blocked=relay.unavailable?.[role==='hitter'?'batters':'pitchers']||[];
 return !blocked.some(x=>x.name===name&&x.side===side);
}
function startSituationRelay(){
 if(!situationHistoryStat||recLeague!=='kbo'||!RELAY_SUPPORTED.has(situationHistoryStat)){situationRelayJob=null;return;}
 const name=playerSheet,role=recKind,stat=situationHistoryStat,state={...recSituation[role]};
 const signature=JSON.stringify([name,role,recYear,recSeason,state,stat]);
 if(situationRelayJob?.signature===signature)return;
 const games=situationRelayCandidates(name,stat),job={signature,total:games.length,done:0,failed:0,errors:[],running:true};situationRelayJob=job;
 let next=0;

function appearanceOuts(p){

  if(['starter','start','선발'].includes(role))return 'start';

    for(const p of Array.isArray(e.pitching)?e.pitching:[]){
      if(S(p.name)!==S(name))continue;
      const role=appearanceRole(p,e);if(!role){unknown=true;continue}

  const total=k=>rows.every(r=>r[k]!==null&&r[k]!==undefined&&Number.isFinite(Number(r[k])))?rows.reduce((sum,r)=>sum+Number(r[k]),0):null;
  const ab=total('ab'),hit=total('hit');
  return `<tr class="record-total">${ranked?'<td>—</td>':''}${cols.map(([k])=>{
    if(k==='n')return '<td>합계</td>';
    if(Object.prototype.hasOwnProperty.call(overrides,k))return `<td>${overrides[k]}</td>`;
    if(k==='ops')return `<td>${formatOPS(summedOPS(rows))}</td>`;
    const value=k==='avg'?(ab!==null&&hit!==null&&ab>0?hit/ab:null):total(k);
    return `<td>${value===null?'—':k==='avg'?(value>=1?value.toFixed(3):value.toFixed(3).slice(1)):value}</td>`;
  }).join('')}</tr>`;
}

function pitcherTotalsRow(rows,cols){
  const sum=k=>rows.reduce((n,r)=>n+(Number(r[k])||0),0);
  const selected=new Set(rows.map(r=>r.n));
  const buckets={all:{outs:0,er:0,complete:true},start:{outs:0,er:0,complete:true},relief:{outs:0,er:0,complete:true}};
  for(const e of Repo.all().filter(e=>e.type===recLeague&&!isCancelled(e)&&recordSeasonMatches(e)&&hasScore(e)&&S(e.date).slice(0,4)===String(recYear))){
    for(const p of Array.isArray(e.pitching)?e.pitching:[]){
      if(!selected.has(S(p.name)))continue;
      const outs=appearanceOuts(p),er=recordNumber(p,['earnedRuns','er']),role=appearanceRole(p,e);
      const add=b=>{if(outs===null||er===null)b.complete=false;else{b.outs+=outs;b.er+=er;}};
      add(buckets.all);
      if(role)add(buckets[role]);else{buckets.start.complete=false;buckets.relief.complete=false;}
    }
  }
  const era=b=>b.complete&&b.outs>0?(b.er*27/b.outs).toFixed(2):'—';
  const outs=buckets.all.outs,ip=buckets.all.complete?(outs%3?`${Math.floor(outs/3)}.${outs%3}`:String(outs/3)):'—';
  return hitterTotalsRow(rows,cols,false,{ip,era:era(buckets.all),starterEra:era(buckets.start),reliefEra:era(buckets.relief)});
}

function parseHrEntries(e){
  if(Array.isArray(e&&e.hrEntries))return e.hrEntries.map(x=>({player:S(x.player),inning:+x.inning||0,runs:+x.runs||0})).filter(x=>x.player&&x.inning&&x.runs);
  const y=+(S(e&&e.date).slice(0,4)||TODAY.getFullYear());
  const hitters=rosterForYear(y).filter(x=>x.t==='hitter').map(x=>x.n).sort((a,b)=>b.length-a.length);
  return S(e&&e.homeRuns).split(/\n+/).map(line=>{
    const x=line.trim();if(!x)return null;
    const player=hitters.find(n=>x===n||x.startsWith(n+' '))||'';
    const im=x.match(/(\d{1,2})회/),rm=x.match(/([1-4])점/);
    return player&&im&&rm?{player,inning:+im[1],runs:+rm[1]}:null;
  }).filter(Boolean);
}

function opponentWinningHitDescription(e,name){

function opponentWinningHitGames(name,opp){
  const year=String(opponentYear);

function opponentStatHistory(name,stat,opp){
  if(stat==='gw')return opponentWinningHitGames(name,opp).map(g=>({date:S(g.event.date),opp:S(g.event.opp),count:1,detail:[+g.event.headerNo>0?'더블헤더 '+g.event.headerNo+'차전':'',g.winningHitDescription].filter(Boolean).join(' · ')}));
  const yr=String(opponentYear),key={hit:'hits',rbi:'rbi',runs:'runs',sb:'stolenBases',hr:'homeRuns'}[stat];
  if(!key)return [];
  const rows=[];
  Repo.all()
    .filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===yr&&S(e.opp)===S(opp)&&Array.isArray(e.batting))
    .forEach(e=>{
      const players=e.batting.filter(x=>S(x.name)===S(name));
      const count=players.reduce((total,p)=>total+(+p[key]||0),0);
      if(count<=0)return;

      let detail='';
      if(stat==='hr'){
        const hrs=parseHrEntries(e).filter(x=>S(x.player)===S(name));
        if(hrs.length)detail=hrs.map(x=>`${x.inning}회 · ${x.runs}점 홈런`).join(' / ');
      }

      rows.push({
        date:S(e.date),
        opp:S(e.opp)||'상대팀',
        count,
        detail
      });
    });

}

const opponentAverage=(ab,hit)=>ab?(hit/ab>=1?'1.000':(hit/ab).toFixed(3).slice(1)):'—';
function opponentPlayerGames(name,opp=''){
  const year=String(opponentYear),keys={ab:'atBats',hit:'hits',rbi:'rbi',runs:'runs',d2:'doubles',d3:'triples',hr:'homeRuns',sb:'stolenBases'};
  return Repo.all().filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===year&&(!opp||S(e.opp)===S(opp))&&Array.isArray(e.batting)).map(e=>{
    const players=e.batting.filter(p=>S(p.name)===S(name));if(!players.length)return null;
    const stats={};for(const [key,field] of Object.entries(keys))stats[key]=players.reduce((sum,p)=>sum+(+p[field]||0),0);
    const line=sumOpsLines(players.map(p=>opsBattingLine(e,p)));return {event:e,...stats,_opsLine:line,ops:formatOPS(battingRates(line).ops),avg:opponentAverage(stats.ab,stats.hit)};
  }).filter(Boolean).sort((a,b)=>S(b.event.date).localeCompare(S(a.event.date))||(+b.event.headerNo||0)-(+a.event.headerNo||0)||S(b.event.time).localeCompare(S(a.event.time)));
}
function opponentBattingSplits(name){
  const byTeam=new Map(TEAMS.map(opp=>[opp,{opp,ab:0,hit:0,rbi:0,runs:0,d2:0,d3:0,hr:0,sb:0,homeAb:0,homeHit:0,awayAb:0,awayHit:0,_opsLine:Object.fromEntries(OPS_FIELDS.map(key=>[key,0]))}]));
  for(const game of opponentPlayerGames(name)){
    const row=byTeam.get(S(game.event.opp));if(!row)continue;
    for(const key of ['ab','hit','rbi','runs','d2','d3','hr','sb'])row[key]+=game[key];
    row._opsLine=sumOpsLines([row._opsLine,game._opsLine]);
    const side=S(game.event.homeAway);
    if(side==='home'||side==='away'){row[side+'Ab']+=game.ab;row[side+'Hit']+=game.hit;}
  }
  return [...byTeam.values()].map(r=>({...r,ops:formatOPS(battingRates(r._opsLine).ops),avg:opponentAverage(r.ab,r.hit),homeAvg:opponentAverage(r.homeAb,r.homeHit),awayAvg:opponentAverage(r.awayAb,r.awayHit)}));
}

function opponentPitcherGames(name,opp){
  const year=String(opponentYear);
  const aliases={hits:['hits','hitsAllowed','h'],homeRuns:['homeRuns','homeRunsAllowed','hr'],strikeouts:['strikeouts','strikeOuts','so','k'],walks:['walks','basesOnBalls','bb'],hitByPitch:['hitByPitch','hitBatters','hbp'],runs:['runs','runsAllowed','r'],earnedRuns:['earnedRuns','er']};
  return Repo.all().filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===year&&S(e.opp)===S(opp)).map(e=>{
    const players=(Array.isArray(e.pitching)?e.pitching:[]).filter(p=>S(p.name)===S(name));if(!players.length)return null;
    const roles=players.map(p=>appearanceRole(p,e)),role=roles.every(r=>r!==null&&r===roles[0])?roles[0]:null;
    const values=players.map(appearanceOuts),outs=values.every(v=>v!==null)?values.reduce((sum,v)=>sum+v,0):null;
    const stats={};for(const [k,fields] of Object.entries(aliases)){const parts=players.map(p=>recordNumber(p,fields));stats[k]=parts.every(v=>v!==null)?parts.reduce((sum,v)=>sum+v,0):null;}
    const decisions=!e.manualOverride&&e.kbo?.doosanDecisions?e.kbo.doosanDecisions:e;
    const result=[['winP','승'],['loseP','패'],['saveP','세이브'],['holdP','홀드']].filter(([field])=>names(decisions[field]).includes(name)).map(([,label])=>label).join(' · ');
    return {event:e,role,...stats,ip:outs===null?'—':outs%3?`${Math.floor(outs/3)}.${outs%3}`:String(outs/3),era:outs!==null&&outs>0&&stats.earnedRuns!==null?(stats.earnedRuns*27/outs).toFixed(2):'—',result};
  }).filter(Boolean).sort((a,b)=>S(b.event.date).localeCompare(S(a.event.date))||(+b.event.headerNo||0)-(+a.event.headerNo||0));
}

function opponentPitchingRows(opp){
  const byName=new Map(),year=String(opponentYear);
  const get=name=>{if(!byName.has(name))byName.set(name,{n:name,g:0,ipOuts:0,w:0,l:0,s:0,h:0,hits:0,homeRuns:0,strikeouts:0,walks:0,hitByPitch:0,runs:0,earnedRuns:0});return byName.get(name);};
  const aliases={hits:['hits','hitsAllowed','h'],homeRuns:['homeRuns','homeRunsAllowed','hr'],strikeouts:['strikeouts','strikeOuts','so','k'],walks:['walks','basesOnBalls','bb'],hitByPitch:['hitByPitch','hitBatters','hbp'],runs:['runs','runsAllowed','r'],earnedRuns:['earnedRuns','er']};
  for(const e of Repo.all().filter(e=>e.type==='kbo'&&!e.stage&&!isExhibition(e)&&!isCancelled(e)&&hasScore(e)&&S(e.date).slice(0,4)===year&&S(e.opp)===S(opp))){

      const row=get(name);row.g++;
      const outs=appearanceOuts(p);if(outs===null)row.ipOuts=null;else if(row.ipOuts!==null)row.ipOuts+=outs;
      for(const [key,fields] of Object.entries(aliases)){const value=recordNumber(p,fields);if(value===null)row[key]=null;else if(row[key]!==null)row[key]+=value;}
    }
    const decisions=!e.manualOverride&&e.kbo?.doosanDecisions?e.kbo.doosanDecisions:e;
    for(const [field,key] of [['winP','w'],['loseP','l'],['saveP','s'],['holdP','h']])for(const name of new Set(names(decisions[field])))if(byName.has(name)||rosterForYear(+year).some(p=>p.n===name&&p.t==='pitcher'))get(name)[key]++;
  }
  return [...byName.values()].map(row=>({...row,ip:row.ipOuts===null?'—':row.ipOuts%3?`${Math.floor(row.ipOuts/3)}.${row.ipOuts%3}`:String(row.ipOuts/3),era:row.ipOuts!==null&&row.ipOuts>0&&row.earnedRuns!==null?(row.earnedRuns*27/row.ipOuts).toFixed(2):null}));
}
function opponentPitchingTable(){

function verifiedMatchupPlays(e,relay,name,role){
 const id=S(e.kboGameId),ourSide=id.slice(8,10)==='OB'?'away':'home',side=role==='hitter'?ourSide:ourSide==='away'?'home':'away';
 if(matchupPlayerBlocked(relay,name,role,side))return null;

function opponentMatchupData(){

 for(const e of games){
  const id=S(e.kboGameId),relay=cachedPlayerRelay(id,'',role);if(!relay||!Array.isArray(relay.plays)){missing++;continue}
  const ourSide=id.slice(8,10)==='OB'?'away':'home',side=role==='hitter'?ourSide:ourSide==='away'?'home':'away';
  if(matchupPlayerBlocked(relay,target,role==='hitter'?'pitcher':'hitter',side)){unverified++;continue}
  let incomplete=false;
  const namesHere=new Set((e[role==='hitter'?'batting':'pitching']||[]).map(p=>S(p.name)).filter(Boolean));
  if(!namesHere.size){unverified++;continue}
  for(const name of namesHere){
   const verified=verifiedMatchupPlays(e,relay,name,role);if(verified===null){incomplete=true;continue}
   const plays=verified.filter(p=>S(p[role==='hitter'?'pitcher':'batter'])===target);if(!plays.length)continue;
   const required=['ab','hit','hr','so','bb','hbp'];if(plays.some(p=>required.some(k=>!Number.isFinite(p.stats?.[k])||p.stats[k]<0))){incomplete=true;continue}
   if(!byName.has(name))byName.set(name,{n:name,pa:0,ab:0,hit:0,hr:0,so:0,bb:0,hbp:0,opsLines:[],games:[]});
   const row=byName.get(name);row.pa+=plays.length;for(const key of required)row[key]+=plays.reduce((sum,p)=>sum+p.stats[key],0);row.opsLines.push(...plays.map(p=>{const ab=p.stats.ab,hit=p.stats.hit,d2=recordNumber(p.stats,['d2']),d3=recordNumber(p.stats,['d3']),hr=p.stats.hr,bb=p.stats.bb,hbp=p.stats.hbp,sf=recordNumber(p.stats,['sf'])??(ab>0||bb>0||hbp>0?0:S(p.result)?/희생플라이|희비/.test(p.result)?1:0:null),tb=[hit,d2,d3,hr].every(Number.isFinite)?hit+d2+2*d3+3*hr:null;return {ab,hit,d2,d3,hr,bb,hbp,sf,tb}}));row.games.push({event:e,plays});
  }

 }

function startOpponentMatchups(){

 const job={signature,total:games.length,done:0,failed:0,running:games.length>0};opponentMatchupJob=job;let next=0;
 const active=()=>opponentMatchupJob===job&&opponentPlayerTarget===selection&&isOpponentPlayerMatchup();
 Promise.resolve().then(()=>Promise.all(Array.from({length:2},async()=>{
  while(next<games.length&&active()){
   const e=games[next++];try{await readSituationRelay(e.kboGameId,'',selection.role)}catch{job.failed++}job.done++;
   if(active())rerender();

}

let eduDraft=null;
const EDU_BAT_FIELDS=[['atBats','타수'],['hits','안타'],['doubles','2루타'],['triples','3루타'],['homeRuns','홈런'],['stolenBases','도루'],['walks','볼넷'],['hitByPitch','사구'],['intentionalWalks','고의4구'],['groundedIntoDoublePlay','병살타'],['order','타순']];
const EDU_PITCH_FIELDS=[['innings','이닝'],['hits','피안타'],['homeRuns','피홈런'],['strikeouts','탈삼진'],['walks','볼넷'],['hitByPitch','사구'],['runs','실점'],['earnedRuns','자책점']];
function eduInnings(p){
  if(p.outs!==undefined&&p.outs!==null&&p.outs!==''&&Number.isFinite(+p.outs))return `${Math.floor(+p.outs/3)}.${+p.outs%3}`;
  const v=S(p.innings??p.inningsPitched??p.ip)||'0';
  const f=v.match(/^(?:(\d+)\s+)?([12])\/3$/);
  return f?`${+f[1]||0}.${+f[2]}`:v;
}
function ensureEduDraft(e){
  const key=e.id||'new';
  if(eduDraft?.key===key)return;
  eduDraft={key,hitter:new Map(),pitcher:new Map(),selected:{hitter:new Set(),pitcher:new Set()}};
  for(const [role,field] of [['hitter','batting'],['pitcher','pitching']]){
    for(const p of e[field]||[]){
      const n=S(p.name);if(!n)continue;
      const x={...p};
      if(role==='pitcher'){
        x.innings=eduInnings(x);
        const aliases={fourBalls:['fourBalls'],hits:['hitsAllowed','h'],homeRuns:['homeRunsAllowed','hr'],strikeouts:['strikeOuts','so','k'],walks:['basesOnBalls','bb'],hitByPitch:['hitBatters','hbp'],runs:['runsAllowed','r'],earnedRuns:['er']};
        for(const [k,ks] of Object.entries(aliases))if(x[k]===undefined)x[k]=ks.map(a=>x[a]).find(v=>v!==undefined)??0;
      }
      eduDraft[role].set(n,x);eduDraft.selected[role].add(n);
    }
  }
}
function captureEduInputs(validate=false){
  if(!eduDraft)return;
  for(const el of document.querySelectorAll('[data-edu-stat]')){
    const role=el.dataset.eduRole,n=el.dataset.eduName,k=el.dataset.eduStat;
    const p=eduDraft[role].get(n)||{name:n};
    if(k==='innings'){
      const v=S(el.value)||'0',m=v.match(/^(\d+)(?:\.([012]))?$/),f=v.match(/^(?:(\d+)\s+)?([12])\/3$/);
      if(validate&&!m&&!f)throw new Error(n+': 이닝은 0, 1.1, 1.2 또는 1 1/3 형식으로 입력해주세요');
      p.innings=v;if(m||f)p.outs=m?+m[1]*3+(+m[2]||0):(+f[1]||0)*3+(+f[2]);
    }else{
      const v=Number(el.value||0);
      if(validate&&(!Number.isInteger(v)||v<0||(k==='order'&&v>9)))throw new Error(n+': 기록은 0 이상의 정수로, 타순은 0~9로 입력해주세요');
      p[k]=validate?v:el.value;
    }
    eduDraft[role].set(n,p);
  }
  if(validate){
    for(const p of eduSelectedRows('hitter'))if((+p.doubles||0)+(+p.triples||0)+(+p.homeRuns||0)>(+p.hits||0))throw new Error(p.name+': 장타 합계가 안타 수보다 많습니다');
    for(const p of eduSelectedRows('pitcher'))if((+p.earnedRuns||0)>(+p.runs||0))throw new Error(p.name+': 자책점이 실점보다 많습니다');
  }
}
function eduSelectedRows(role){
  return [...eduDraft.selected[role]].map(n=>({...eduDraft[role].get(n),name:n}));
}
function eduEditorHTML(e,part='all',onlyRole=null){
  ensureEduDraft(e);
  const year=+(S(e.date).slice(0,4)||TODAY.getFullYear()),roster=eduRosterForYear(year);
  return `${part==='records'?`<h2>교육리그 ${onlyRole==='pitcher'?'투수':onlyRole==='hitter'?'타자':'선수'} 기록 입력</h2>`:`<h2>교육리그 출전 선수 선택</h2><div class="note">출전한 선수를 선택하면 해당 선수의 기록 입력칸이 표시됩니다. 모든 기록이 0이어도 출전자로 저장됩니다. 이닝의 .1은 1/3, .2는 2/3이닝입니다.</div>`}${[['hitter','타자',EDU_BAT_FIELDS],['pitcher','투수',EDU_PITCH_FIELDS]].filter(([role])=>!onlyRole||role===onlyRole).map(([role,label,fields])=>{
    const candidates=[...new Set([...roster.filter(p=>p.t===role).map(p=>p.n),...eduDraft.selected[role]])];
    return `${part==='records'?'':`<h3>${label} 출전자</h3><div style="display:flex;gap:10px;flex-wrap:wrap">${candidates.map(n=>`<label style="margin:4px 0"><input type="checkbox" style="width:auto" data-edu-select="${role}" data-edu-name="${esc(n)}"${eduDraft.selected[role].has(n)?' checked':''}> ${esc(n)}</label>`).join('')||'<div class="note">선수 관리에서 해당 연도의 교육리그 명단을 등록해주세요.</div>'}</div>`}${part==='selection'?'':(!eduDraft.selected[role].size?`<div class="note">${label} 출전자를 선수 선택 화면에서 체크하면 기록 입력칸이 표시됩니다.</div>`:'')+[...eduDraft.selected[role]].map(n=>{
      const p=eduDraft[role].get(n)||{name:n};
      return `<div class="card" style="margin-top:12px"><b>${esc(n)}</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px">${fields.map(([k,l])=>`<label>${l}<input ${k==='innings'?'type="text" inputmode="decimal"':'type="number" min="0" step="1"'}${k==='order'?' max="9"':''} data-edu-role="${role}" data-edu-name="${esc(n)}" data-edu-stat="${k}" value="${esc(p[k]??0)}"></label>`).join('')}</div></div>`;
    }).join('')}`;
  }).join('')}`;
}
function refreshEduEditor(){
  const box=document.querySelector('#edu_editor');if(!box)return;

function adminPlayerChoices(e){

function milestoneSeasonGames(year=TODAY.getFullYear()){
 return Repo.all().filter(e=>{
  if(e.demo||e.type!=='kbo'||isCancelled(e)||isExhibition(e)||isPostseasonRecord(e)||!hasScore(e)||S(e.date).slice(0,4)!==String(year)||S(e.date)>TS)return false;
  const series=e.kbo?.seriesId??e.seriesId,stage=S(e.stage).replace(/\s/g,'');
  return (series===undefined||series===null||series===''||+series===0)&&(!stage||stage==='정규시즌');
 });
}
function milestoneSeasonRows(role,year=TODAY.getFullYear(),rosterOverride=null){
 const roster=(rosterOverride||rosterForYear(TODAY.getFullYear())).filter(p=>p.t===role),metrics=MILESTONE_METRICS[role];
 const rows=roster.map(p=>({n:p.n,stats:Object.fromEntries(metrics.map(m=>[m.key,0])),games:0}));
 const byName=new Map(rows.map(r=>[r.n,r])),events=milestoneSeasonGames(year);
 const missing=events.some(e=>!Array.isArray(e[role==='hitter'?'batting':'pitching'])||!e[role==='hitter'?'batting':'pitching'].length);
 for(const e of events){
  const players=Array.isArray(e[role==='hitter'?'batting':'pitching'])?e[role==='hitter'?'batting':'pitching']:[],grouped=new Map();
  for(const p of players){const n=S(p.name);if(!byName.has(n))continue;if(!grouped.has(n))grouped.set(n,[]);grouped.get(n).push(p)}
  for(const [name,entries] of grouped){const r=byName.get(name);r.games++;r.stats.g++;
   for(const m of metrics){if(m.key==='g'||m.decision)continue;
    const values=entries.map(p=>{
     if(m.key==='ipOuts')return appearanceOuts(p);
     if(m.key==='bb'||m.key==='fourBalls'){const explicit=m.key==='fourBalls'?recordNumber(p,['fourBalls']):null;if(explicit!==null)return explicit;const bb=recordNumber(p,['walks','bb']),ibb=role==='hitter'?(recordNumber(p,['intentionalWalks','ibb'])??0):0,hbp=recordNumber(p,['hitByPitch','hitBatters','hbp']);return bb===null||m.key==='fourBalls'&&hbp===null?null:bb+ibb+(m.key==='fourBalls'?hbp:0)}
     const value=recordNumber(p,m.fields);if(m.key!=='tb'||value!==null)return value;
     const parts=[recordNumber(p,['hits','hit']),recordNumber(p,['doubles']),recordNumber(p,['triples']),recordNumber(p,['homeRuns','hr'])];
     return parts.some(v=>v===null)?null:parts[0]+parts[1]+parts[2]*2+parts[3]*3;
    });
    if(values.some(v=>v===null))r.stats[m.key]=null;
    else if(r.stats[m.key]!==null)r.stats[m.key]+=values.reduce((a,b)=>a+b,0);
   }
  }
  if(role==='pitcher'){
   const d=!e.manualOverride&&e.kbo?.doosanDecisions?e.kbo.doosanDecisions:e;
   for(const m of metrics.filter(m=>m.decision))for(const name of new Set(names(d[m.decision]))){const r=byName.get(name);if(r)r.stats[m.key]++}
  }
 }
 // An incomplete box score must not be presented as a full season total.
 if(missing)for(const r of rows)for(const m of metrics)if(!m.decision)r.stats[m.key]=null;
 return {rows,events,missing};
}
function milestoneInningOuts(value){
 const match=S(value).match(/^(\d+)(?:\.([012]))?$/);return match?+match[1]*3+(+match[2]||0):null;
}
function milestoneDisplay(value,metric,remaining=false){
 if(value===null)return '—';
 if(metric.key!=='ipOuts')return Number(value).toLocaleString('ko-KR');
 const whole=Math.floor(value/3),rem=value%3;
 return rem?(remaining?`${whole?whole+' ':''}${rem}/3`:`${whole}.${rem}`):String(whole);
}
function milestoneRows({limit=20,inclusive=false}={}){
 const metrics=MILESTONE_METRICS[milestoneRole].filter(m=>milestoneMetric==='all'||milestoneMetric===m.key),rows=[];
 if(milestoneScope==='bears')return bearsFranchiseRows();
 if(milestoneScope==='career'){
  const seasons=new Map(),events=[];let missing=false;
  const years=[...new Set(Repo.all().map(e=>+S(e.date).slice(0,4)).filter(y=>Number.isInteger(y)&&y<=TODAY.getFullYear()))];
  for(const p of rosterForYear(TODAY.getFullYear()).filter(p=>p.t===milestoneRole)){
   const entry=CAREER_BASELINES[baselineKey(milestoneRole,p.n)];if(!entry)continue;
   const sums={...entry.baseline};if(Number.isFinite(sums.bb)&&Number.isFinite(sums.hbp))sums.fourBalls=sums.bb+sums.hbp;
   for(const year of years.filter(y=>y>entry.baselineYear)){
    if(!seasons.has(year))seasons.set(year,milestoneSeasonRows(milestoneRole,year));
    const season=seasons.get(year),r=season.rows.find(r=>r.n===p.n);
    missing||=season.missing;
    for(const m of metrics){const n=r?.stats[m.key];if(sums[m.key]===undefined||sums[m.key]===null||n===null||n===undefined)sums[m.key]=null;else sums[m.key]+=n}
   }
   for(const metric of metrics){
    const current=sums[metric.key];if(!Number.isSafeInteger(current)||current<=0)continue;
    const step=CAREER_STEPS[metric.key],target=(Math.floor(current/step)+1)*step;
    if(!milestoneClose(target-current,metric,limit,inclusive))continue;
    rows.push({n:p.n,current,target,remaining:target-current,metric});
   }
  }
  for(const season of seasons.values())events.push(...season.events);
  return {rows,events,missing};
 }
 const season=milestoneSeasonRows(milestoneRole);
 for(const metric of metrics)for(const player of season.rows){
  const current=player.stats[metric.key];if(current===null||current<=0)continue;
  const target=(Math.floor(current/metric.step)+1)*metric.step,remaining=target-current;
  if(!milestoneClose(remaining,metric,limit,inclusive))continue;
  rows.push({n:player.n,current,target,remaining,metric});
 }
 return {...season,rows};
}
function milestoneRecordUnit(m){return ({hit:'안타',d2:'2루타',d3:'3루타',hr:'홈런',rbi:'타점',runs:'득점',sb:'도루',g:'경기',tb:'루타',w:'승',s:'세이브',h:'홀드',strikeouts:'탈삼진',bb:'볼넷',fourBalls:'4사구',hbp:m.label==='사구'?'사구':'몸에 맞는 공',ipOuts:'이닝'})[m.key]||m.unit}
function milestoneCards(rows){

  const m=r.metric,unit=milestoneRecordUnit(m),progress=Math.min(100,r.current/r.target*100);

 }).join('');
}

function seasonSpecialMemo(key,calculate){return typeof recordRenderMemo==='function'?recordRenderMemo(key,calculate):calculate()}
function seasonOpponentAchievementRows(role){return seasonSpecialMemo('season-opponents-'+role,()=>{
 const active=new Set(rosterForYear(TODAY.getFullYear()).filter(p=>p.t===role).map(p=>p.n)),byName=new Map();let missing=false;
 for(const e of milestoneSeasonGames()){
  if(!TEAMS.includes(S(e.opp)))continue;
  let winners=[];
  if(role==='pitcher'){
   const d=!e.manualOverride&&e.kbo?.doosanDecisions?e.kbo.doosanDecisions:e;
   if(d.winP==null){missing=true;continue}winners=[...new Set(names(d.winP))];
  }else{
   if(!Array.isArray(e.batting)||!e.batting.length){missing=true;continue}
   for(const p of e.batting){if(!active.has(S(p.name)))continue;const hr=opsSourceNumber(e,p,['homeRuns','hr']);if(hr===null){missing=true;continue}if(hr>0)winners.push(S(p.name))}
  }
  for(const name of winners){if(!active.has(name))continue;if(!byName.has(name))byName.set(name,new Set());byName.get(name).add(S(e.opp))}
 }
 return {missing,rows:[...byName].map(([n,teams])=>({n,count:teams.size,remaining:TEAMS.filter(t=>!teams.has(t))})).filter(r=>r.remaining.length<=1).sort((a,b)=>a.remaining.length-b.remaining.length||a.n.localeCompare(b.n,'ko'))};
})}
function seasonComboRows(limit=20,inclusive=false){return seasonSpecialMemo('season-combos-'+limit+'-'+inclusive,()=>{

  const hr=p.stats.hr,sb=p.stats.sb;if(!Number.isFinite(hr)||!Number.isFinite(sb))return [];
  return [20,30].flatMap(goal=>{const hrLeft=Math.max(0,goal-hr),sbLeft=Math.max(0,goal-sb),remaining=hrLeft+sbLeft;
   return remaining===0||milestoneClose(remaining,{key:'combo'},limit,inclusive)?[{n:p.n,goal,hr,sb,hrLeft,sbLeft,achieved:remaining===0}]:[];
  });
 });
})}
function orderedStreakGames(){

  const key=e.kboGameId||e.id||[e.date,e.opp,e.time,e.doubleHeader||e.gameNo||1].join('|');unique.set(key,e);
 }
 return [...unique.values()].sort((a,b)=>S(a.date).localeCompare(S(b.date))||S(a.time||'').localeCompare(S(b.time||''))||S(a.kboGameId||a.id).localeCompare(S(b.kboGameId||b.id),undefined,{numeric:true}));

function seasonHitStreakRows(){return seasonSpecialMemo('season-hit-streaks',()=>{
 const states=new Map(rosterForYear(TODAY.getFullYear()).filter(p=>p.t==='hitter').map(p=>[p.n,{n:p.n,count:0,exact:false,last:null,uncertain:false}]));
 for(const e of orderedStreakGames())for(const r of states.values()){
  if(!Array.isArray(e.batting)||!e.batting.length){r.count=0;r.exact=false;r.uncertain=true;continue}
  const entries=e.batting.filter(p=>S(p.name)===r.n);if(!entries.length)continue; // Did not bat: neither extend nor end.
  const sum=fields=>{const values=entries.map(p=>opsSourceNumber(e,p,fields));return values.some(v=>v===null)?null:values.reduce((a,b)=>a+b,0)};
  const hits=sum(['hits','hit']);if(hits===null){r.count=0;r.exact=false;r.uncertain=true;continue}
  if(hits>0){r.count++;r.last=e.date;r.uncertain=false;continue}
  const ab=sum(['atBats','ab']),sfValues=entries.map(p=>opsBattingLine(e,p).sf),sf=sfValues.some(v=>v===null)?null:sfValues.reduce((a,b)=>a+b,0);
  if((ab!==null&&ab>0)||(sf!==null&&sf>0)){r.count=0;r.exact=true;r.uncertain=false;r.last=e.date}
  else if(ab===null||sf===null){r.count=0;r.exact=false;r.uncertain=true}
 }
 return [...states.values()].filter(r=>!r.uncertain&&r.count>0).sort((a,b)=>b.count-a.count||a.n.localeCompare(b.n,'ko'));
})}

function seasonRegulationOuts(year){return year>=2015?144*3:year>=2013?128*3:year>=2009?133*3:year>=2005?126*3:null}
function seasonConsecutiveRows(role,limit=20,inclusive=false){return seasonSpecialMemo('season-consecutive-'+role+'-'+limit+'-'+inclusive,()=>{
 const year=TODAY.getFullYear(),roster=rosterForYear(year).filter(p=>p.t===role),current=milestoneSeasonRows(role),rows=[];
 const savedYears=[...new Set(Repo.all().map(e=>Number(S(e.date).slice(0,4))).filter(y=>y<year))],past=new Map();
 for(const y of savedYears)past.set(y,milestoneSeasonRows(role,y,roster));
 for(const p of roster){
  const history=SEASON_HISTORY_SEED.find(r=>r.name===p.n&&r.role===role),season=current.rows.find(r=>r.n===p.n);
  const metrics=[...SEASON_STREAK_METRICS[role]];
  if(role==='hitter'){const values=[season?.stats.sb,...Object.values(history?.seasons||{}).map(s=>s.sb)],maximum=Math.max(50,...values.filter(Number.isFinite));for(let goal=20;goal<=Math.ceil(maximum/10)*10;goal+=10)metrics.push({key:'sb',goal,label:goal+'도루',unit:'도루'})}
  for(const metric of metrics){
   const goal=y=>metric.key==='ipOuts'?seasonRegulationOuts(y):metric.goal;
   let previous=0,start=year;for(let y=year-1;y>=1982;y--){
    const threshold=goal(y);if(threshold===null)break;
    const value=history&&y<=history.throughYear?(history.seasons[y]?.[metric.key]??0):past.get(y)?.rows.find(r=>r.n===p.n)?.stats[metric.key];
    if(!Number.isFinite(value)||value<threshold)break;previous++;start=y;
   }
   const value=season?.stats[metric.key],target=goal(year);if(!Number.isFinite(value)||target===null)continue;
   const achieved=value>=target,remaining=Math.max(0,target-value),count=previous+(achieved?1:0);
   if(achieved?count<2:previous<1||!milestoneClose(remaining,metric,limit,inclusive))continue;
   rows.push({n:p.n,metric,start:achieved&&previous===0?year:start,count,next:previous+1,value,remaining,achieved});
  }
 }

})}

const KBO_CAREER_COLUMNS={

function parseKboCareerTable(raw,role,baselineYear,scope='career'){
 if(!Number.isInteger(baselineYear)||baselineYear<1981||baselineYear>=TODAY.getFullYear())throw Error('기준 연도를 먼저 확인해주세요.');
 const text=S(raw).replace(/,/g,'').replace(/\u00a0/g,' ').replace(/\r/g,'').replace(/\s+/g,' ').trim();
 if(/퓨처스|포스트시즌/.test(text))throw Error('KBO 정규시즌 통산 표를 붙여넣어주세요.');
 if(role==='pitcher'&&/\bAVG\b/.test(text)||role==='hitter'&&/\bERA\b/.test(text))throw Error('타자·투수 선택과 붙여넣은 표가 달라요.');
 const columns=KBO_CAREER_COLUMNS[role],rates=new Set(['avg','slg','obp','era','wpct']),rows=[];
 const pattern=/(?:^|\s)((?:19|20)\d{2})\s+([^\s\d]+)\s+(.+?)(?=\s+(?:19|20)\d{2}\s+[^\s\d]+\s|\s+통산(?:\s|$)|$)/g;
 for(const match of text.matchAll(pattern)){
  const year=+match[1];let tokens=match[3].trim().split(/\s+/);
  if(role==='pitcher'){
   const ipIndex=columns.indexOf('ipOuts');
   if(/^[12]\/3$/.test(tokens[ipIndex+1]||'')){tokens.splice(ipIndex,2,tokens[ipIndex]+'.'+tokens[ipIndex+1][0])}
   else if(/^[12]\/3$/.test(tokens[ipIndex]||''))tokens[ipIndex]='0.'+tokens[ipIndex][0];
  }
  if(tokens.length!==columns.length)throw Error(year+'년 행의 항목 수가 달라요. 연도·팀명부터 마지막 기록까지 표 전체를 복사해주세요.');
  const values={};columns.forEach((key,i)=>{
   if(rates.has(key)){if(!/^(?:\d+(?:\.\d+)?|—|-)$/.test(tokens[i]))throw Error(year+'년 비율 칸을 확인해주세요.');return}
   const v=parseCareerValue(tokens[i],{key,label:key});if(v===null)throw Error(year+'년 기록에 빈칸이 있어요.');values[key]=v;
  });
  rows.push({year,team:match[2],values});
 }
 if(!rows.length)throw Error('연도별 행을 찾지 못했어요. 통산 합계만 말고 연도별 표 전체를 붙여넣어주세요.');
 const included=rows.filter(r=>r.year<=baselineYear),excluded=rows.filter(r=>r.year>baselineYear);if(!included.length)throw Error('기준 연도까지의 행이 없어요.');
 if(scope==='bears')for(const year of new Set(included.map(r=>r.year))){const list=included.filter(r=>r.year===year);if(list.some(r=>/합계|전체/.test(r.team))&&!list.some(r=>!/합계|전체/.test(r.team)))throw Error(year+'년 팀별 행이 필요해요. 합계만 있는 표로는 베어스 기록을 구분할 수 없어요.')}
 const selected=scope==='bears'?included.filter(r=>/^(두산|OB|오비)$/i.test(r.team)):included;
 const grouped=new Map();for(const r of selected){if(!grouped.has(r.year))grouped.set(r.year,[]);grouped.get(r.year).push(r)}
 const sums={};for(const m of CAREER_INPUT_FIELDS[role])if(m.key!=='sf')sums[m.key]=0;
 for(const [year,list] of grouped){
  const combined=list.filter(r=>/합계|전체/.test(r.team));
  if(combined.length>1)throw Error(year+'년 합계 행이 중복됐어요.');
  const use=combined.length?combined:list;
  const teams=new Set();for(const r of use){if(teams.has(r.team))throw Error(year+'년 '+r.team+' 행이 중복됐어요.');teams.add(r.team);for(const [k,v] of Object.entries(r.values)){sums[k]=(sums[k]||0)+v;if(!Number.isSafeInteger(sums[k]))throw Error('기록이 너무 커요.')}}
 }
 return {baseline:sums,years:[...grouped.keys()].sort(),excluded:[...new Set(excluded.map(r=>r.year))].sort()};
}

const OPS_FIELDS=['ab','hit','d2','d3','hr','bb','hbp','sf','tb'];
function opsSourceNumber(e,p,fields){
 const explicit=recordNumber(p,fields);if(explicit!==null)return explicit;
 const candidates=(e.kbo?.hitters||[]).flat().filter(q=>q&&S(q.name)===S(p.name)&&S(q.teamId)==='OB');
 return candidates.length===1?recordNumber(candidates[0],fields):null;
}
function opsBattingLine(e,p){
 const aliases={ab:['atBats','ab'],hit:['hits','hit'],d2:['doubles','d2'],d3:['triples','d3'],hr:['homeRuns','hr'],hbp:['hitByPitch','hbp'],sf:['sacrificeFlies','sf'],tb:['totalBases','tb']};
 const line=Object.fromEntries(Object.entries(aliases).map(([key,fields])=>[key,opsSourceNumber(e,p,fields)]));
 const bb=opsSourceNumber(e,p,['walks','bb']),ibb=opsSourceNumber(e,p,['intentionalWalks','ibb']);line.bb=bb===null?null:bb+(ibb??0);
 if(line.sf===null&&e.type==='kbo'&&e.kbo?.parserVersion&&e.kbo.etc&&typeof e.kbo.etc==='object'&&(!e.manualOverride||(e.kbo.hitters||[]).flat().some(q=>q&&S(q.name)===S(p.name)&&S(q.teamId)==='OB')))line.sf=recordEtcCount(e.kbo.etc['희생플라이'],p.name);
 if(line.tb===null&&[line.hit,line.d2,line.d3,line.hr].every(Number.isFinite))line.tb=line.hit+line.d2+2*line.d3+3*line.hr;
 return line;
}
function sumOpsLines(lines){return Object.fromEntries(OPS_FIELDS.map(key=>[key,lines.length&&lines.every(line=>Number.isFinite(line?.[key]))?lines.reduce((sum,line)=>sum+line[key],0):null]))}
function battingRates(line){
 const ab=line?.ab,h=line?.hit,tb=line?.tb,bb=line?.bb,hbp=line?.hbp,sf=line?.sf;
 const slg=Number.isFinite(ab)&&ab>0&&Number.isFinite(tb)?tb/ab:null;
 const denominator=[ab,bb,hbp,sf].every(Number.isFinite)?ab+bb+hbp+sf:null;
 const obp=denominator>0&&[h,bb,hbp].every(Number.isFinite)?(h+bb+hbp)/denominator:null;
 return {slg,obp,ops:slg!==null&&obp!==null?slg+obp:null};
}
function formatOPS(value){return Number.isFinite(value)?value.toFixed(3):'—'}
function addOPSFields(rows,games){
 const byName=new Map();let missingBox=false;
 for(const e of games){if(!Array.isArray(e.batting)){missingBox=true;continue}for(const p of e.batting){const name=S(p.name);if(!name)continue;if(!byName.has(name))byName.set(name,[]);byName.get(name).push(opsBattingLine(e,p))}}
 return rows.map(row=>{const line=missingBox?sumOpsLines([]):sumOpsLines(byName.get(row.n)||[]),rates=battingRates(line);return {...row,_opsLine:line,ops:rates.ops,obp:rates.obp,slg:rates.slg}});
}
function summedOPS(rows){return battingRates(sumOpsLines(rows.map(r=>r._opsLine))).ops}

 const year=context==='opponent'?(typeof opponentYear==='number'?opponentYear:TODAY.getFullYear()):recYear,league=context==='opponent'?'kbo':recLeague;
 const seen=new Set();
 return Repo.all().filter(e=>{
  if(e.demo||e.type!==league||isCancelled(e)||isExhibition(e)||!hasScore(e)||S(e.date)>TS||S(e.date).slice(0,4)!==String(year))return false;

  const id=S(e.kboGameId||e.id)||[e.date,e.type,e.opp,e.homeAway,e.headerNo||0].join('|');if(seen.has(id))return false;seen.add(id);return true;

function recordEtcCount(text,name){
 const escaped=S(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),pattern=new RegExp('(?:^|[\\s,])'+escaped+'(\\d+)?[（(]([^）)]*)[）)]','g');let count=0;

  const contenders=ranked.slice(0,3).map((p,index)=>({n:p.name,current:p.stats[metric.key],rank:ranked.filter(q=>q.stats[metric.key]>p.stats[metric.key]).length+1,remaining:best+1-p.stats[metric.key]}));
  if(!contenders.length)continue;

  rows.push({...first,target:best+1,metric,leading:first.current===best,holders,record:best,sourceUrl:p.sourceUrl,following:contenders.slice(1)});

 }
 return {rows,events:[...seasons.values()].flatMap(s=>s.events),missing};
}

 }).join('');

let recordRenderCache=null;
function recordRenderMemo(key,calculate){
 if(!recordRenderCache)return calculate();
 if(!recordRenderCache.has(key))recordRenderCache.set(key,calculate());
 return recordRenderCache.get(key);
}
function renderWithRecordCache(render){
 const previous=recordRenderCache;recordRenderCache=new Map();
 try{return render()}finally{recordRenderCache=previous}
}

  else if(t.dataset.restoreAuto){Repo.restoreAuto(t.dataset.restoreAuto).then(()=>keep()).catch(e=>alert('복원하지 못했습니다: '+(e.message||'')))}
  else if(t.dataset.edit){const event=Repo.all().find(x=>x.id===t.dataset.edit);if(!event)return;editing=event;eduDraft=null;const step=+t.dataset.editStep||1;adminFormStep=adminEditSteps(event).includes(step)?step:1;adminView='form';keep()}
  else if(t.dataset.del){const target=Repo.all().find(x=>x.id===t.dataset.del);if(target?.kboGameId){alert('KBO 자동 기록은 여기서 삭제하지 않습니다.');return}if(confirm('삭제할까요?')){Repo.remove(t.dataset.del).catch(e=>alert('삭제하지 못했습니다: '+(e.message||''))).finally(keep)}}
});


document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target?.id==='admin_search'){
    ev.preventDefault();
    adminSearch=S(ev.target.value);
    if(adminSearch)adminCalDate='';
    const y=scrollY;route2();scrollTo(0,y);
  }
});


document.addEventListener('change',ev=>{
  const map={f_place:'f_place_custom',f_opp:'f_opp_custom',f_homeAway:'f_homeAway_custom',f_cancelReason:'f_cancelReason_custom'};
  const id=map[ev.target?.id];
  if(!id)return;
  const input=document.getElementById(id);
  if(!input)return;
  const custom=ev.target.value==='__custom__';
  input.style.display=custom?'':'none';
  if(custom)input.focus();
});

document.addEventListener('input',ev=>{if(ev.target.matches('[data-edu-stat]'))captureEduInputs();const box=document.querySelector('#kbo_manual'),el=ev.target;if(box&&(el.matches('[data-batter],.hr-player,.hr-inning,.hr-runs')||/^f_(sd|so|starter|oppStarter|winP|loseP|saveP|holdP|gwRbi|doubles|triples|hits|steals|duration)$/.test(el.id)))box.checked=true});

function route2(){const r=document.body.dataset.r;$('#app').innerHTML=renderWithRecordCache(()=>recordMenuLayout(r==='standings'?standings():r==='records'?records():r==='h2h'?h2hView():r==='opponent'?opponentStatsView():r==='milestones'?milestonesView():r==='admin'?admin():r==='players'?playerManagement():home(),r));}
addEventListener('hashchange',route);route();

/* ============ 3. PWA (아이콘/manifest 런타임 생성) ============ */
try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#131230';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='800 92px -apple-system,sans-serif';x.textAlign='center';x.fillText('B',90,118);
  x.fillStyle='#e5322d';x.fillRect(50,134,80,8);const url=c.toDataURL('image/png');
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=url;document.head.appendChild(l);
  const m={name:'BEARStat',short_name:'BEARStat',display:'standalone',start_url:location.href.split('#')[0],background_color:'#f4f5f9',theme_color:'#131230',icons:[{src:url,sizes:'180x180',type:'image/png'}]};
  const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(ml);
}catch(e){}
</script>
