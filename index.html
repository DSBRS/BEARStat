<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ▼▼ Supabase 설정 (README 참고). 비워두면 DEMO 조회 전용으로 동작 ▼▼ */
const SUPABASE_URL="https://maxtwmgfobrnpxbjdzjl.supabase.co",SUPABASE_KEY="sb_publishable_6ZxZjyKxvsUspmmG6K8RPg_xq_sL6Qu";
/* ============ 1. 데이터 계층 (웹/iOS 위젯 공유 스키마) ============
 * Event = {id,date,type,title,time,opp,venue,starter,score:{d,o},stage,gameNo,series,
 *          broadcast,players[],program,channel,place,desc,demo}
 * type: kbo|edu|club|fan|broadcast|radio|ticket|etc
 * 실서비스: 이 Repo를 REST API(/api/events?from=&to=)로 교체하면 웹·WidgetKit이 같은 JSON을 사용.
 */
const TEAMS=['LG','KT','SSG','NC','KIA','롯데','삼성','한화','키움'];
const TYPES={kbo:'KBO',edu:'교육리그',club:'구단 행사',fan:'팬 행사',broadcast:'방송',radio:'라디오/유튜브',ticket:'티켓 예매',etc:'기타'};
const VENUES=['서울종합운동장 야구장','수원 케이티 위즈 파크','인천 SSG 랜더스필드','창원NC파크','광주-기아 챔피언스 필드','사직 야구장','대구 삼성 라이온즈 파크','대전 한화생명 볼파크','고척 스카이돔','이천 베어스 파크','고양 국가대표 야구 훈련장','서산 전용 연습구장','LG 챔피언스 파크','문경 상무 야구장','상동 야구장','삼성 라이온즈 볼파크','울산 문수 야구장','기아 챌린저스 필드','익산 국가대표 야구훈련장','마산 야구장'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const H=n=>((n*2654435761)>>>0)%100;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const TS=ymd(TODAY);

const DEMO=[]; // 실제 일정은 관리자 화면에서 직접 등록

/* 권한: 쓰기는 Supabase RLS(admins 테이블에 등록된 계정만)가 서버에서 강제합니다.
 * isOwner는 화면 표시용일 뿐 보안 경계가 아닙니다. */
let isOwner=false,CUSTOM=[],SB=null,BEARS_ROSTER=[],ROSTERS_BY_YEAR={},OTHERS_BY_YEAR={},AUTO_STANDINGS_BY_YEAR={};
let adminRosterYear=TODAY.getFullYear(),adminStandingsYear=TODAY.getFullYear();
const live=()=>CUSTOM.some(e=>e.source==='kbo');
const Repo={
  all(){const a=DEMO.concat(CUSTOM),k=e=>e.date+e.type,isG=e=>e.type==='kbo',lv=CUSTOM.some(e=>e.source==='kbo'),real=new Set(a.filter(e=>!e.demo&&isG(e)).map(k));
    return a.filter(e=>!(e.demo&&isG(e)&&(lv||real.has(k(e)))))}, // 실제 수집 데이터가 있으면 DEMO 경기는 모두 숨김
  custom(){return CUSTOM},
  async saveOthers(rows,year=adminStandingsYear){if(!SB)throw new Error('Supabase 설정이 필요합니다');const y=+year||TODAY.getFullYear(),key='standings_others_'+y;const r=await SB.from('kv').upsert({key,body:rows});if(r.error)throw r.error;OTHERS_BY_YEAR[y]=rows;if(y===TODAY.getFullYear())OTHERS=rows;rerender()},
  async saveRoster(rows,year=adminRosterYear){if(!SB)throw new Error('Supabase 설정이 필요합니다');rows=normRoster(rows);const y=+year||TODAY.getFullYear(),key='bears_roster_'+y;const r=await SB.from('kv').upsert({key,body:rows});if(r.error)throw r.error;ROSTERS_BY_YEAR[y]=rows;if(y===TODAY.getFullYear())BEARS_ROSTER=rows;rerender()},
  async load(){const r=await SB.from('events').select('body');if(!r.error)CUSTOM=r.data.map(x=>x.body);
    const ks=await SB.from('kv').select('key,body').like('key','standings_others%');if(!ks.error){let legacy=null;for(const x of ks.data||[]){if(x.key==='standings_others')legacy=x.body;else{const m=String(x.key).match(/^standings_others_(\d{4})$/);if(m)OTHERS_BY_YEAR[+m[1]]=x.body}}if(!OTHERS_BY_YEAR[TODAY.getFullYear()]&&legacy)OTHERS=legacy;else OTHERS=OTHERS_BY_YEAR[TODAY.getFullYear()]||[]}
    const br=await SB.from('kv').select('key,body').like('key','bears_roster%');if(!br.error){let legacy=null;for(const x of br.data||[]){if(x.key==='bears_roster')legacy=normRoster(x.body);else{const m=String(x.key).match(/^bears_roster_(\d{4})$/);if(m)ROSTERS_BY_YEAR[+m[1]]=normRoster(x.body)}}BEARS_ROSTER=ROSTERS_BY_YEAR[TODAY.getFullYear()]||legacy||[]}
    const asr=await SB.from('kv').select('key,body').like('key','standings_auto_%');if(!asr.error){for(const x of asr.data||[]){const m=String(x.key).match(/^standings_auto_(\d{4})$/);if(m&&Array.isArray(x.body))AUTO_STANDINGS_BY_YEAR[+m[1]]=x.body}}
    rerender()},
  async upsert(ev){if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').upsert({id:ev.id,date:ev.date,body:ev});if(r.error)throw r.error;await this.load()},
  async remove(id){if(!SB)throw new Error('Supabase 설정이 필요합니다');const r=await SB.from('events').delete().eq('id',id);if(r.error)throw r.error;await this.load()}
};
/* ============ KBO 자동 연동 ============ */
/* 미래 경기 자동 표시:
 * kbo_game_records에 미래 경기 일정이 저장되면 score가 없어도 캘린더/일정에 표시됩니다.
 * 같은 game_id가 경기 종료 후 upsert되면 결과와 선수 기록으로 갱신됩니다.
 */

let KBO_AUTO=[],KBO_WARNING='',KBO_MERGE_WARNINGS=[];
function mergeEvents(manual,automatic){
  const rows=manual.map(e=>({...e})),warnings=[];
  const same=(m,a)=>m.type==='kbo'&&m.date===a.date&&m.opp===a.opp&&(!m.homeAway||m.homeAway===a.homeAway);
  for(const auto of automatic){
    let matches=rows.filter(m=>m.type==='kbo'&&(m.kboGameId===auto.kboGameId||m.id===auto.id));
    if(!matches.length){matches=rows.filter(m=>!m.kboGameId&&same(m,auto));if(matches.length&&(matches.length!==1||automatic.filter(a=>same(matches[0],a)).length!==1||auto.headerNo>0)){warnings.push(`${auto.date} ${auto.opp}: 더블헤더 또는 중복 수동 일정 — 경기 ID 연결 필요`);continue}}
    if(matches.length>1){warnings.push(`${auto.kboGameId}: 중복 연결`);continue}
    if(!matches.length){rows.push({...auto});continue}
    const old=matches[0],index=rows.indexOf(old),merged=old.manualOverride?{...auto,...old}:{...old,...auto};
    for(const key of ['title','desc','channel','program','players','series'])if(old[key]!==undefined&&old[key]!=='')merged[key]=old[key];
    merged.id=old.id;merged.kboGameId=auto.kboGameId;merged.kbo=auto.kbo;merged.manualOverride=!!old.manualOverride;rows[index]=merged;
  }
  return{rows,warnings};
}
const _manualAll=Repo.all.bind(Repo),_manualLoad=Repo.load.bind(Repo),_manualUpsert=Repo.upsert.bind(Repo);
Repo.all=function(){const x=mergeEvents(_manualAll(),KBO_AUTO);KBO_MERGE_WARNINGS=x.warnings;return x.rows};
Repo.load=async function(){
  if(SB){try{const rows=[];for(let start=0;;start+=500){const r=await SB.from('kbo_game_records').select('body').order('game_id').range(start,start+499);if(r.error)throw r.error;rows.push(...r.data.map(x=>x.body));if(r.data.length<500)break}
    KBO_AUTO=rows.filter(b=>b&&typeof b==='object'&&S(b.kbo?.leagueId)!=='2').map(b=>({
      ...b,
      type:'kbo',
      source:b.source||'kbo',
      status:b.status||((b.score&&S(b.score.d)!==''&&S(b.score.v)!=='')?'final':'scheduled')
    }));
    KBO_WARNING=''
  }catch(e){KBO_WARNING='KBO 자동 기록을 갱신하지 못했습니다. 저장된 수동 일정은 계속 사용할 수 있습니다.'}}
  await _manualLoad();
};
Repo.upsert=async function(ev){
  if(ev.kboGameId){ev.manualOverride=!!document.querySelector('#kbo_manual')?.checked;if(ev.manualOverride&&Array.isArray(ev.batting))ev.batting=ev.batting.map((p,i)=>{const x={...p};for(const k of ['hits','doubles','triples','homeRuns','stolenBases']){const el=document.querySelector(`[data-batter="${i}"][data-stat="${k}"]`);if(el){const n=Number(el.value);if(!Number.isInteger(n)||n<0)throw new Error('타자 기록은 0 이상의 정수로 입력해주세요');x[k]=n}}if((+x.doubles||0)+(+x.triples||0)+(+x.homeRuns||0)>(+x.hits||0))throw new Error('장타 합계가 안타 수보다 많습니다');return x})}
  return _manualUpsert(ev);
};

function isUpcomingKbo(e){

let recSort=null,recKind='pitcher',recBatTab='main',recYear=TODAY.getFullYear();

// 투수 승/패/홀드/세이브의 단일 기준점:
// KBO 자동 경기 = kbo.doosanDecisions, 수동/오버라이드 경기 = 입력한 winP/loseP/holdP/saveP.
function recStats(){
  const yr=String(recYear),m={},roster=rosterForYear(recYear),role=new Map(roster.map(x=>[x.n,x.t]));
  const row=(n,want)=>{if(role.get(n)!==want)return null;if(!m[n])m[n]={n,w:0,l:0,s:0,h:0,g:0,hr:0,d2:0,d3:0,hit:0,sb:0,ab:0,bb:0,hbp:0,ibb:0,rbi:0,runs:0,avg:0,o1:0,o2:0,o3:0,o4:0,o5:0,o6:0,o7:0,o8:0,o9:0};return m[n]};
  const addNames=(v,k,want)=>names(v).forEach(n=>{const r=row(n,want);if(r)r[k]++});
  Repo.all().filter(e=>e.type==='kbo'&&!e.cancelReason&&!e.stage&&S(e.date).slice(0,4)===yr&&hasScore(e)).forEach(e=>{
    if(e.kboGameId&&!e.manualOverride&&e.kbo?.doosanDecisions){const d=e.kbo.doosanDecisions;addNames(d.winP,'w','pitcher');addNames(d.loseP,'l','pitcher');addNames(d.saveP,'s','pitcher');addNames(d.holdP,'h','pitcher');addNames(d.gwRbi,'g','hitter')}else{addNames(e.winP,'w','pitcher');addNames(e.loseP,'l','pitcher');addNames(e.saveP,'s','pitcher');addNames(e.holdP,'h','pitcher');addNames(e.gwRbi,'g','hitter')}
    if(e.kboGameId&&Array.isArray(e.batting)){e.batting.forEach(p=>{const r=row(S(p.name),'hitter');if(!r)return;r.ab+=+p.atBats||0;r.hit+=+p.hits||0;r.d2+=+p.doubles||0;r.d3+=+p.triples||0;r.hr+=+p.homeRuns||0;r.sb+=+p.stolenBases||0;r.bb+=+p.walks||0;r.hbp+=+p.hitByPitch||0;r.ibb+=+p.intentionalWalks||0;r.rbi+=+p.rbi||0;r.runs+=+p.runs||0;const o=+p.order;if(o>=1&&o<=9)r['o'+o]++})}
    else{const hrs=parseHrEntries(e);if(hrs.length)hrs.forEach(x=>addNames(x.player,'hr','hitter'));else{const hitters=roster.filter(x=>x.t==='hitter').map(x=>x.n).sort((a,b)=>b.length-a.length);S(e.homeRuns).split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const n=hitters.find(name=>line===name||line.startsWith(name+' '));if(n)addNames(n,'hr','hitter')})}const rep=(v,k)=>S(v).split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{const r=row(n,'hitter');if(r)r[k]++});rep(e.doubles,'d2');rep(e.triples,'d3');rep(e.hits,'hit');rep(e.steals,'sb')}
  });Object.values(m).forEach(r=>{r.avg=r.ab?r.hit/r.ab:0});return Object.values(m);
}

  Repo.all().filter(e=>e.type==='kbo'&&!e.cancelReason&&!e.stage&&S(e.date).slice(0,4)===yr).forEach(e=>{

    if(o>=1&&o<=9)counts[o]++;

function pitcherDetail(name){
  const yr=String(recYear);
  let g=0;

  // 경기수는 실제 pitching 배열에 해당 투수가 등장한 경기만 계산
  Repo.all()
    .filter(e=>e.type==='kbo'&&!e.cancelReason&&!e.stage&&S(e.date).slice(0,4)===yr&&hasScore(e))
    .forEach(e=>{
      if(Array.isArray(e.pitching)&&e.pitching.some(p=>S(p.name)===S(name)))g++;
    });

  // 승/패/홀드/세이브는 개인기록 표와 완전히 같은 기준 사용.
  // 자동연동 경기는 kbo.doosanDecisions를 우선하므로 상대팀 투수 기록이 섞이지 않음.
  const season=recStats().find(r=>S(r.n)===S(name))||{w:0,l:0,h:0,s:0};

  return {
    g,
    w:+season.w||0,
    l:+season.l||0,
    h:+season.h||0,
    s:+season.s||0
  };
}
function hitterDetail(name){
  return recStats().find(r=>S(r.n)===S(name))||null;

function records(){
  const roster=rosterForYear(recYear);
  if(!roster.length)return `<div class="brand"><div class="logo">개인기록</div></div><div class="card"><div class="empty">두산 선수 명단이 아직 없습니다.<br>관리자에서 선수 명단을 저장하면 두산 선수만 집계됩니다.</div></div>`;

  const cols=recKind==='pitcher'
    ?[['n','선수'],['w','승리'],['l','패전'],['s','세이브'],['h','홀드']]
    :recBatTab==='order'
      ?[['n','선수'],['o1','1번'],['o2','2번'],['o3','3번'],['o4','4번'],['o5','5번'],['o6','6번'],['o7','7번'],['o8','8번'],['o9','9번']]
      :recBatTab==='onbase'
        ?[['n','선수'],['bb','볼넷(4구)'],['hbp','사구'],['ibb','고의4구']]
        :[['n','선수'],['ab','타수'],['hit','안타'],['avg','타율'],['d2','2루타'],['d3','3루타'],['hr','홈런'],['sb','도루']];

  const rows=recStats().filter(r=>{
    const p=roster.find(x=>x.n===r.n);
    return p&&p.t===recKind;
  });

  const cn=(a,b)=>a.n.localeCompare(b.n,'ko');
  rows.sort((a,b)=>{
    if(!recSort)return cn(a,b);
    const k=recSort.k,asc=recSort.dir==='asc';
    if(k==='n')return asc?cn(a,b):cn(b,a);
    return(asc?a[k]-b[k]:b[k]-a[k])||cn(a,b);
  });

  const head=cols.map(([k,l])=>{
    const on=recSort&&recSort.k===k;
    return `<th><button class="sh${on?' on':''}" data-sort="${k}">${l}${on?(recSort.dir==='desc'?' ↓':' ↑'):''}</button></th>`;
  }).join('');

  const st=recSort?(()=>{
    const c=(cols.find(x=>x[0]===recSort.k)||['','정렬'])[1],d=recSort.dir==='desc';
    return `정렬: ${c} ${d?'↓':'↑'} (${recSort.k==='n'?(d?'가나다 역순':'가나다순'):(d?'많은 순':'적은 순')})`;
  })():'열 제목을 누르면 정렬됩니다';

  return `<div class="brand"><div class="logo">개인기록</div></div>
  ${recordTabs()}
  ${rows.length?`<div class="card"><div class="recscroll"><table class="rec recstats"><tr>${head}</tr>${rows.map(r=>`<tr>${cols.map(([k])=>`<td>${k==='n'?`<button class="playerlink" data-player="${esc(r.n)}">${esc(r.n)}</button>`:k==='avg'?(r.avg>=1?'1.000':r.avg.toFixed(3).slice(1)):r[k]}</td>`).join('')}</tr>`).join('')}</table></div></div>`:`<div class="card"><div class="empty">아직 집계할 ${recKind==='pitcher'?'투수':'타자'} 기록이 없습니다.</div></div>`}
  <div class="foot">${recYear}년 KBO · 두산 선수 명단 기준<br>${st}</div>${playerSheetHTML()}`;
}


function parseHrEntries(e){
  if(Array.isArray(e&&e.hrEntries))return e.hrEntries.map(x=>({player:S(x.player),inning:+x.inning||0,runs:+x.runs||0})).filter(x=>x.player&&x.inning&&x.runs);
  const y=+(S(e&&e.date).slice(0,4)||TODAY.getFullYear());
  const hitters=rosterForYear(y).filter(x=>x.t==='hitter').map(x=>x.n).sort((a,b)=>b.length-a.length);
  return S(e&&e.homeRuns).split(/\n+/).map(line=>{
    const x=line.trim();if(!x)return null;
    const player=hitters.find(n=>x===n||x.startsWith(n+' '))||'';
    const im=x.match(/(\d{1,2})회/),rm=x.match(/([1-4])점/);
    return player&&im&&rm?{player,inning:+im[1],runs:+rm[1]}:null;
  }).filter(Boolean);
}
function hrRowHTML(x={},year=TODAY.getFullYear()){
  const hitters=[...new Set([...rosterForYear(year).filter(p=>p.t==='hitter').map(p=>p.n),S(x.player)].filter(Boolean))];
  return `<div class="hr-row" style="display:grid;grid-template-columns:minmax(0,1fr) 78px 72px auto;gap:6px;align-items:center;margin-top:8px">
    <select class="hr-player"><option value="">선수</option>${hitters.map(n=>`<option value="${esc(n)}"${S(x.player)===n?' selected':''}>${esc(n)}</option>`).join('')}</select>
    <select class="hr-inning"><option value="">이닝</option>${Array.from({length:11},(_,i)=>i+1).map(n=>`<option value="${n}"${+x.inning===n?' selected':''}>${n}회</option>`).join('')}</select>
    <select class="hr-runs"><option value="">점수</option>${[1,2,3,4].map(n=>`<option value="${n}"${+x.runs===n?' selected':''}>${n}점</option>`).join('')}</select>
    <button type="button" class="link" data-hrdel style="margin:0">삭제</button>
  </div>`;
}
function hrEditor(e){
  const rows=parseHrEntries(e),year=+(S(e&&e.date).slice(0,4)||TODAY.getFullYear());
  return `<label>홈런 기록</label><div id="hr_rows">${(rows.length?rows:[{}]).map(x=>hrRowHTML(x,year)).join('')}</div><button type="button" class="btn g" id="addhr">+ 홈런 추가</button><div class="note">선수는 등록된 타자 명단에서 선택 · 이닝 1~11회 · 점수 1~4점</div>`;
}

function opponentStatsView(){

    const sortValue=(r,k)=>k==='avg'?avgNum(r):(+r[k]||0);
    const dir=oppSortDir==='asc'?1:-1;

    <div class="calhead" style="margin-bottom:6px"><button class="ib" data-aroster="-1">‹</button><b>${adminRosterYear}년 선수 명단</b><button class="ib" data-aroster="1"${adminRosterYear>=TODAY.getFullYear()+1?' disabled':''}>›</button></div>

    <textarea id="f_pitchers" rows="10" placeholder="한 줄에 한 명씩 입력">${esc(rosterForYear(adminRosterYear).filter(x=>x.t==='pitcher').map(x=>x.n).join('\n'))}</textarea>
    <label>타자 명단</label>
    <textarea id="f_hitters" rows="10" placeholder="한 줄에 한 명씩 입력">${esc(rosterForYear(adminRosterYear).filter(x=>x.t==='hitter').map(x=>x.n).join('\n'))}</textarea>
    <button class="btn" id="saveroster">${adminRosterYear}년 선수 명단 저장</button>
    <div class="note">시즌별 명단을 따로 저장합니다. 기존 bears_roster는 현재 연도 명단이 없을 때만 호환용으로 사용됩니다.</div>
  </div>
  <h2>다른 구단 시즌 성적 (순위표용)</h2><div class="card"><div class="calhead" style="margin-bottom:6px"><button class="ib" data-astand="-1">‹</button><b>${adminStandingsYear}년 순위 입력</b><button class="ib" data-astand="1"${adminStandingsYear>=TODAY.getFullYear()+1?' disabled':''}>›</button></div>${TEAMS.map(t=>{const o=othersForYear(adminStandingsYear).find(x=>x.n===t)||{w:'',d:'',l:''};return `<div class="ev" style="align-items:center"><div class="tm" style="width:52px">${t}</div><div class="bd" style="display:flex;gap:6px"><input data-o="${t}" data-k="w" type="number" min="0" placeholder="승" value="${o.w}"><input data-o="${t}" data-k="d" type="number" min="0" placeholder="무" value="${o.d}"><input data-o="${t}" data-k="l" type="number" min="0" placeholder="패" value="${o.l}"></div></div>`}).join('')}<button class="btn" id="saveo">${adminStandingsYear}년 순위 성적 저장</button><div class="note">두산 성적은 해당 연도의 등록 경기 결과로 자동 계산됩니다. 다른 구단 성적은 연도별로 따로 저장됩니다.</div></div>
  <h2>직접 등록한 일정</h2><div class="card">${list.length?list.map(x=>`<div class="ev"><div class="tm">${x.date.slice(5)}</div><div class="bd"><div class="ti">${x.title}</div><div class="sb">${TYPES[x.type]}${x.cancelReason?' · '+esc(x.cancelReason)+' 취소':''}${x.kboGameId?' · KBO 자동연동':''}</div><button class="link" data-edit="${x.id}">수정</button>${x.kboGameId?'':`<button class="link" data-del="${x.id}">삭제</button>`}</div></div>`).join(''):'<div class="empty">등록한 일정이 없습니다.</div>'}</div>
  `;
}

function route(){
  const r=location.hash.replace('#/','')||'home';
  $('#app').innerHTML=r==='standings'?standings():r==='records'?records():r==='h2h'?h2hView():r==='opponent'?opponentStatsView():r==='admin'?admin():home();
  $('#nav').innerHTML=[['home','홈'],['standings','순위'],['records','개인기록'],['h2h','맞대결'],['opponent','상대전적']].map(([k,l])=>`<a href="#/${k==='home'?'':k}" class="${r===k?'on':''}">${l}</a>`).join('');
  document.body.dataset.r=r;window.scrollTo(0,0);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-d],[data-m],[data-t],[data-x],[data-sort],[data-osort],[data-player],[data-sheetclose],[data-sheetback],[data-rkind],[data-rbtab],[data-ryear],[data-syear],[data-aroster],[data-astand],[data-hrdel],[data-edit],[data-del],#addhr,#save,#saveo,#saveroster,#cancel,#login,#logout');if(!t)return;
  const keep=()=>{const y=scrollY;route2();scrollTo(0,y)};
  if(t.dataset.d){sel=t.dataset.d;const d=new Date(sel+'T00:00:00');view=new Date(d.getFullYear(),d.getMonth(),1);keep()}
  else if(t.dataset.m!==undefined){const m=+t.dataset.m;if(m===0){sel=TS;view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1)}else view=new Date(view.getFullYear(),view.getMonth()+m,1);keep()}
  else if(t.dataset.x){const id=t.dataset.x;openIds.has(id)?openIds.delete(id):openIds.add(id);keep()}
  else if(t.dataset.player){playerSheet=t.dataset.player;keep()}
  else if(t.dataset.sheetclose!==undefined){playerSheet=null;keep()}
  else if(t.dataset.sheetback!==undefined&&ev.target===t){playerSheet=null;keep()}
  else if(t.dataset.sort){const k=t.dataset.sort;recSort=(recSort&&recSort.k===k)?{k,dir:recSort.dir==='desc'?'asc':'desc'}:{k,dir:k==='n'?'asc':'desc'};keep()}  else if(t.dataset.rkind){recKind=t.dataset.rkind;recSort=null;playerSheet=null;keep()}
  else if(t.dataset.rbtab){recBatTab=t.dataset.rbtab;recSort=null;playerSheet=null;keep()}
  else if(t.dataset.ryear!==undefined){const y=recYear+(+t.dataset.ryear||0);recYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));recSort=null;playerSheet=null;keep()}
  else if(t.dataset.syear!==undefined){const y=stYear+(+t.dataset.syear||0);stYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}
  else if(t.dataset.aroster!==undefined){const y=adminRosterYear+(+t.dataset.aroster||0);adminRosterYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}
  else if(t.dataset.astand!==undefined){const y=adminStandingsYear+(+t.dataset.astand||0);adminStandingsYear=Math.max(2000,Math.min(TODAY.getFullYear()+1,y));keep()}  else if(t.dataset.osort){
    const k=t.dataset.osort;
    if(oppSort===k)oppSortDir=oppSortDir==='desc'?'asc':'desc';
    else{oppSort=k;oppSortDir='desc'}
    rerender();
  }  else if(t.dataset.t){h2h=t.dataset.t;keep()}
  else if(t.id==='addhr'){const box=$('#hr_rows'),y=+(S($('#f_date')?.value).slice(0,4)||TODAY.getFullYear());if(box)box.insertAdjacentHTML('beforeend',hrRowHTML({},y))}
  else if(t.dataset.hrdel!==undefined){const row=t.closest('.hr-row');if(row){const box=$('#hr_rows');row.remove();if(box&&!box.querySelector('.hr-row'))box.insertAdjacentHTML('beforeend',hrRowHTML({}))}}
  else if(t.id==='login'){SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value}).then(r=>{if(r.error)alert('로그인 실패: '+r.error.message)})}
  else if(t.id==='logout'){SB.auth.signOut()}
  else if(t.id==='saveo'){const rows=TEAMS.map(n=>{const g=k=>+(document.querySelector(`[data-o="${n}"][data-k="${k}"]`).value||0);return{n,w:g('w'),d:g('d'),l:g('l')}});
    Repo.saveOthers(rows,adminStandingsYear).then(()=>{alert(adminStandingsYear+'년 순위 성적을 저장했습니다');keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'')))}
  else if(t.id==='saveroster'){
    const splitList=id=>[...new Set((document.querySelector(id)?.value||'').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean))];
    const rows=[
      ...splitList('#f_pitchers').map(n=>({n,t:'pitcher'})),
      ...splitList('#f_hitters').map(n=>({n,t:'hitter'}))
    ];
    const seen=new Set(),clean=[];
    rows.forEach(x=>{if(!seen.has(x.n)){seen.add(x.n);clean.push(x)}});
    Repo.saveRoster(clean,adminRosterYear).then(()=>{alert(adminRosterYear+'년 두산 선수 명단을 저장했습니다');keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'')))
  }
  else if(t.id==='save'){
    const v=k=>$('#f_'+k)?.value?.trim()||'';
    const customVal=(k)=>{
      const base=v(k);
      return base==='__custom__' ? ($('#f_'+k+'_custom')?.value?.trim()||'') : base;
    };
    const type=v('type'),opp=customVal('opp'),homeAway=customVal('homeAway'),cancelReason=customVal('cancelReason'),g=type==='kbo';
    if(g&&!homeAway){alert('경기는 홈/원정을 선택해주세요');return}
    const title=v('title')||(g&&opp?'두산 vs '+opp:'');
    if(!title||!v('date')){alert('날짜와 제목(경기는 상대팀)은 필수입니다');return}
    const sd=v('sd'),so=v('so'),gn=v('gno'),id=editing?editing.id:'c'+Date.now();
    const hrEntries=[...document.querySelectorAll('.hr-row')].map(row=>({player:S(row.querySelector('.hr-player')?.value),inning:+(row.querySelector('.hr-inning')?.value||0),runs:+(row.querySelector('.hr-runs')?.value||0)})).filter(x=>x.player&&x.inning&&x.runs);
    const homeRuns=hrEntries.map(x=>`${x.player} ${x.inning}회 ${x.runs}점`).join('\n');
    const old=editing||{},f=k=>$('#f_'+k)?v(k):S(old[k]);
    Repo.upsert({...old,id,type,date:v('date'),time:v('time'),title,place:customVal('place'),homeAway,program:v('program'),channel:v('channel'),players:v('players').split(',').map(x=>x.trim()).filter(Boolean),desc:v('desc'),opp, cancelReason,venue:customVal('place'),oppStarter:v('oppStarter'),starter:v('starter'),score:(sd!==''&&so!==''&&!isNaN(+sd)&&!isNaN(+so))?{d:+sd,v:+so}:null,stage:v('stage'),gameNo:$('#f_gno')?(gn?+gn:0):(old.gameNo||0),series:f('series'),duration:f('duration'),winP:f('winP'),loseP:f('loseP'),saveP:f('saveP'),holdP:f('holdP'),gwRbi:f('gwRbi'),doubles:f('doubles'),triples:f('triples'),hits:f('hits'),steals:f('steals'),hrEntries,homeRuns}).then(()=>{editing=null;keep()}).catch(e=>alert('저장하지 못했습니다: '+(e.message||'소유자만 수정할 수 있습니다')));
  }
  else if(t.id==='cancel'){editing=null;keep()}
  else if(t.dataset.edit){editing=Repo.all().find(x=>x.id===t.dataset.edit);keep()}
  else if(t.dataset.del){const target=Repo.all().find(x=>x.id===t.dataset.del);if(target?.kboGameId){alert('KBO 자동 기록은 여기서 삭제하지 않습니다.');return}if(confirm('삭제할까요?')){Repo.remove(t.dataset.del).catch(e=>alert('삭제하지 못했습니다: '+(e.message||''))).finally(keep)}}
});

document.addEventListener('change',ev=>{
  const map={f_place:'f_place_custom',f_opp:'f_opp_custom',f_homeAway:'f_homeAway_custom',f_cancelReason:'f_cancelReason_custom'};
  const id=map[ev.target?.id];
  if(!id)return;
  const input=document.getElementById(id);
  if(!input)return;
  const custom=ev.target.value==='__custom__';
  input.style.display=custom?'':'none';
  if(custom)input.focus();
});

document.addEventListener('input',ev=>{const box=document.querySelector('#kbo_manual'),el=ev.target;if(box&&(el.matches('[data-batter],.hr-player,.hr-inning,.hr-runs')||/^f_(sd|so|starter|oppStarter|winP|loseP|saveP|holdP|gwRbi|doubles|triples|hits|steals|duration)$/.test(el.id)))box.checked=true});

function route2(){const r=document.body.dataset.r;$('#app').innerHTML=r==='standings'?standings():r==='records'?records():r==='h2h'?h2hView():r==='opponent'?opponentStatsView():r==='admin'?admin():home();}
addEventListener('hashchange',route);route();

  x.fillStyle='#e5322d';x.fillRect(50,134,80,8);const url=c.toDataURL('image/png');
